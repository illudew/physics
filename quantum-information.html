const LA_FIG = {  };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', note:'注 记', his:'背 景', ext:'拓 展'};
const LA_DATA = [
{id:'quantum_information-ch1',num:'第1章',title:'量子信息基础',en:'FOUNDATIONS',sub:'密度算符 · Schmidt 分解 · 量子操作',desc:'',sections:[{name:'1.1 密度算符',color:'#2563eb',desc:'',items:[{id:'quantum_information-c1s1-1',name:'密度算符',tags:["def", "thm", "der", "app", "note"],brief:'密度算符是描述量子系统最一般状态的工具，既涵盖纯态的相干叠加，也涵盖经典概率混合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>密度算符是描述量子系统最一般状态的工具，既涵盖纯态的相干叠加，也涵盖经典概率混合。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho=\\sum_i p_i|\\psi_i\\rangle\\langle\\psi_i|,\\quad p_i\\ge0,\\ \\sum_i p_i=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由系综定义出发：以概率 p_i 制备 |ψ_i⟩，则任意可观测量 A 的期望为 Σp_i⟨ψ_i|A|ψ_i⟩=tr(ρA)，故 ρ 完全决定统计。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述开放系统、退相干、有限温度态与实验中的实际量子态。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>密度算符是厄米、半正定、迹为 1 的算符；本征值即该正交分解下的概率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>von Neumann 1927 年为量子统计力学引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>态空间是密度算符构成的凸集，纯态是其极点。</p></section></div>`},{id:'quantum_information-c1s1-2',name:'密度算符的性质',tags:["def", "thm", "der", "app", "note"],brief:'密度算符的三个基本性质：厄米性保证期望为实，迹为 1 保证概率归一，半正定性保证任何投影的期望非负。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>密度算符的三个基本性质：厄米性保证期望为实，迹为 1 保证概率归一，半正定性保证任何投影的期望非负。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho^{\\dagger}=\\rho,\\quad \\mathrm{tr}\\rho=1,\\quad \\rho\\ge0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义 ρ=Σp_i|ψ_i⟩⟨ψ_i| 直接验证：共轭转置不变，迹为 Σp_i，对任意 |φ⟩ 有 ⟨φ|ρ|φ⟩=Σp_i|⟨φ|ψ_i⟩|²≥0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断一个矩阵是否为合法量子态，是实验数据处理的第一步。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>满足三性质的矩阵一定可对角化为概率加权投影，故都是合法态。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>这三条构成量子态的算符刻画。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Bloch 表示 ρ=(I+r·σ)/2，半正定等价于 |r|≤1。</p></section></div>`},{id:'quantum_information-c1s1-3',name:'纯态与混合态的判据',tags:["def", "thm", "der", "app", "note"],brief:'纯度 trρ² 是区分纯态与混合态的最简判据：纯态为 1，完全混合态为 1/d。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>纯度 trρ² 是区分纯态与混合态的最简判据：纯态为 1，完全混合态为 1/d。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathrm{tr}\\rho^2=1\\ \\Leftrightarrow\\ \\text{纯态};\\quad \\mathrm{tr}\\rho^2&lt;1\\ \\Leftrightarrow\\ \\text{混合}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>ρ 的本征值为 p_i，trρ²=Σp_i²；由 Σp_i=1 与 p_i≥0 可知仅当某个 p_i=1 时和为 1。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实验上测量纯度以评估制备质量与退相干程度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>纯度不是纠缠度量：可分混合态纯度也可小于 1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>纯度与 von Neumann 熵满足 S=−ln trρ² 的一阶关系。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>常用线性熵 1−trρ² 作为易测量的替代量。</p></section></div>`},{id:'quantum_information-c1s1-4',name:'约化密度算符',tags:["def", "thm", "der", "app", "note"],brief:'对复合系统的一部分取偏迹，得到该子系统的约化密度算符，它包含子系统上所有可观测量的统计信息。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对复合系统的一部分取偏迹，得到该子系统的约化密度算符，它包含子系统上所有可观测量的统计信息。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho_A=\\mathrm{tr}_B(\\rho_{AB})=\\sum_j{}_B\\langle j|\\rho_{AB}|j\\rangle_B$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若 ρ_AB 为纯纠缠态，偏迹后 ρ_A 一般为混合态，这正是纠缠的标志：局域信息丢失。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析开放系统、纠缠度量、量子纠错中的错误传播。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>约化态相同不代表整体态相同，整体可携带非局域关联。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>偏迹是量子信息中使用最频繁的运算之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Bell 态的两个约化态都为 I/2，最大混合。</p></section></div>`}]},{name:'1.2 复合系统与 Schmidt 分解',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c1s2-1',name:'复合系统的张量积',tags:["def", "thm", "der", "app", "note"],brief:'两个量子系统的态空间是各自态空间的张量积，维数相乘，这是量子信息容量指数增长的结构根源。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个量子系统的态空间是各自态空间的张量积，维数相乘，这是量子信息容量指数增长的结构根源。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{H}_{AB}=\\mathcal{H}_A\\otimes\\mathcal{H}_B,\\quad \\dim=d_A d_B$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>算符在张量积上的作用满足 (A⊗B)(|a⟩⊗|b⟩)=A|a⟩⊗B|b⟩；一般算符不能写成单个张量积之和。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述多比特寄存器、系统与环境、通信双方共享的态。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>张量积结构使局域操作只能作用于一个因子，是 LOCC 框架的基础。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Dirac 表述天然适配张量积语言。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子纠缠正是张量积空间中非直积态的存在。</p></section></div>`},{id:'quantum_information-c1s2-2',name:'Schmidt 分解',tags:["def", "thm", "der", "app", "note"],brief:'任意两体纯态都可化为对角形式，系数 λ_i 为 Schmidt 系数，非零个数称为 Schmidt 数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任意两体纯态都可化为对角形式，系数 λ_i 为 Schmidt 系数，非零个数称为 Schmidt 数。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\psi\\rangle_{AB}=\\sum_i \\sqrt{\\lambda_i}\\,|i\\rangle_A|i\\rangle_B,\\quad \\sum_i\\lambda_i=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对态系数矩阵做奇异值分解即得；{ |i⟩_A } 与 { |i⟩_B } 分别是两子系统的正交基。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断纠缠、计算纠缠熵、分析纯化与压缩。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Schmidt 数大于 1 即为纠缠态；Schmidt 系数在两体局域幺正变换下不变。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Schmidt 1907 年在线性代数中提出，量子信息中成为标准工具。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多体情形无通用 Schmidt 分解，需用张量网络近似。</p></section></div>`},{id:'quantum_information-c1s2-3',name:'纯化',tags:["def", "thm", "der", "app", "note"],brief:'任何混合态都可视为某个更大纯态（纯化态）的约化态，且纯化在辅助系统的幺正变换下唯一。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任何混合态都可视为某个更大纯态（纯化态）的约化态，且纯化在辅助系统的幺正变换下唯一。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho_A=\\mathrm{tr}_B\\big(|\\Psi\\rangle\\langle\\Psi|_{AB}\\big)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把 ρ_A 对角化 ρ=Σλ_i|i⟩⟨i|，构造 |Ψ⟩=Σ√λ_i|i⟩_A|i⟩_B，取偏迹即得 ρ_A。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>把噪声与退相干转化为系统与环境的纠缠，统一处理开放系统。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>纯化所需辅助系统维数等于 ρ 的秩，故有限。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>纯化是 Stinespring  dilatation 的态版本。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>热场双态是有限温度量子场论的纯化实现。</p></section></div>`},{id:'quantum_information-c1s2-4',name:'Schmidt 数与纠缠',tags:["def", "thm", "der", "app", "note"],brief:'纯态可分的充要条件是 Schmidt 数为 1，即态可写成直积；否则纠缠。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>纯态可分的充要条件是 Schmidt 数为 1，即态可写成直积；否则纠缠。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{可分}\\ \\Leftrightarrow\\ \\text{Schmidt 数}=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若 |ψ⟩=|a⟩|b⟩，系数矩阵秩为 1，只有一个非零奇异值；反之亦然。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>纠缠判定的最直接方法（限于两体纯态）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>混合态无 Schmidt 分解，需用 PPT 判据或纠缠见证。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Schmidt 数又称 Schmidt 秩，是纠缠的定量指标之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Schmidt 数在 LOCC 下不可增加。</p></section></div>`}]},{name:'1.3 量子操作',color:'#0f766e',desc:'',items:[{id:'quantum_information-c1s3-1',name:'量子操作公理',tags:["def", "thm", "der", "app", "note"],brief:'量子操作（量子信道）是密度算符到密度算符的完全正、保迹映射，描述一切物理上允许的态变换。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子操作（量子信道）是密度算符到密度算符的完全正、保迹映射，描述一切物理上允许的态变换。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}:\\ \\rho\\mapsto\\sum_k E_k\\rho E_k^{\\dagger},\\quad \\sum_k E_k^{\\dagger}E_k\\le I$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>三条公理：线性、完全正性（与任意辅助系统张量积后仍正）、保迹（tr 保持不变，或 ≤I 表示有经典结果）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述噪声、测量、门操作与通信信道。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>完全正性区别于单纯的正性，是量子操作的核心约束。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Kraus 1971 年给出算符和表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>幺正演化是单个 Kraus 算符的特例。</p></section></div>`},{id:'quantum_information-c1s3-2',name:'Kraus 表示',tags:["def", "thm", "der", "app", "note"],brief:'任何完全正保迹映射都可写成算符和形式，Kraus 算符 E_k 的个数不超过 d²。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任何完全正保迹映射都可写成算符和形式，Kraus 算符 E_k 的个数不超过 d²。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}(\\rho)=\\sum_k E_k\\rho E_k^{\\dagger},\\quad \\sum_k E_k^{\\dagger}E_k=I$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 Stinespring 扩张：把系统与环境纠缠、做幺正演化、再取环境偏迹，即得 Kraus 形式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>为具体噪声模型提供显式算符，便于计算与模拟。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Kraus 表示不唯一，相差一个等距变换。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Kraus 1983 年系统阐述算符和表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Kraus 秩是信道的重要参数，反映所需环境维数。</p></section></div>`},{id:'quantum_information-c1s3-3',name:'Stinespring 扩张',tags:["def", "thm", "der", "app", "note"],brief:'任何量子操作都等价于与一个处于纯态的环境做联合幺正演化后丢弃环境，这是开放系统的统一物理图像。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任何量子操作都等价于与一个处于纯态的环境做联合幺正演化后丢弃环境，这是开放系统的统一物理图像。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}(\\rho)=\\mathrm{tr}_E\\big(U(\\rho\\otimes|0\\rangle\\langle0|_E)U^{\\dagger}\\big)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>构造 Kraus 算符到正交环境态 |k⟩_E 的映射，定义 U|ψ⟩|0⟩=Σ_k E_k|ψ⟩|k⟩，验证迹保与完全正性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>把噪声理解为信息泄漏到环境，是退相干与纠错的理论基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>环境维数至少等于 Kraus 秩，通常取 d²。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Stinespring 1955 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该图像表明封闭系统的幺正演化在开放系统中变为非幺正信道。</p></section></div>`},{id:'quantum_information-c1s3-4',name:'量子仪器与测量信道',tags:["def", "thm", "der", "app", "note"],brief:'量子仪器同时给出测量结果与对应的后验态，是比 Kraus 表示更完整的测量描述。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子仪器同时给出测量结果与对应的后验态，是比 Kraus 表示更完整的测量描述。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{I}(\\rho)=\\sum_m \\mathcal{E}_m(\\rho)\\otimes|m\\rangle\\langle m|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>每个结果 m 对应一个非保迹完全正映射 E_m，ΣE_m 保迹；读出经典结果 m 得到后验态 E_m(ρ)/trE_m(ρ)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述实际测量装置、反馈控制与自适应测量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>投影测量与 POVM 都是量子仪器的特例。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Davies 与 Lewis 1970 年提出仪器概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子仪器是量子反馈与量子纠错循环的数学语言。</p></section></div>`}]}]},
{id:'quantum_information-ch2',num:'第2章',title:'纠缠理论',en:'ENTANGLEMENT',sub:'可分性 · 纠缠度量 · 非局域性',desc:'',sections:[{name:'2.1 可分性与纠缠判据',color:'#2563eb',desc:'',items:[{id:'quantum_information-c2s1-1',name:'可分态',tags:["def", "thm", "der", "app", "note"],brief:'不能写成上述凸组合的态称为纠缠态。可分态只含经典关联，可由 LOCC 制备。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不能写成上述凸组合的态称为纠缠态。可分态只含经典关联，可由 LOCC 制备。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho_{AB}=\\sum_i p_i\\,\\rho_A^{(i)}\\otimes\\rho_B^{(i)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>可分态集合是凸集，其极点对应纯直积态；纠缠态位于凸集之外。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>区分经典关联与量子关联，是量子信息理论的基本划分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>判断一个给定的混合态是否可分，一般情形是 NP 难问题。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Werner 1989 年系统研究可分态与纠缠态。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>两比特情形有 Peres-Horodecki 判据可完全判定。</p></section></div>`},{id:'quantum_information-c2s1-2',name:'PPT 判据',tags:["def", "thm", "der", "app", "note"],brief:'部分转置判据（Peres-Horodecki）：可分态对任一子系统做转置后仍为半正定；若出现负本征值则一定纠缠。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>部分转置判据（Peres-Horodecki）：可分态对任一子系统做转置后仍为半正定；若出现负本征值则一定纠缠。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho^{T_A}\\ge0\\ \\text{（可分态必满足）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>直积态转置后仍为直积态且半正定，凸组合保持半正定，故可分态必 PPT。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>两比特与 2×3 系统中 PPT 是充要条件，可完全判定纠缠。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>维数高于 2×3 时存在 PPT 纠缠态（bound entangled），判据只是必要条件。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Peres 1996 年提出，Horodecki 兄弟证明其两比特充分性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>PPT 判据是实验与数值中最常用的纠缠检测手段。</p></section></div>`},{id:'quantum_information-c2s1-3',name:'纠缠见证',tags:["def", "thm", "der", "app", "note"],brief:'纠缠见证是一个厄米算符 W，对所有可分态期望非负，对某些纠缠态为负，从而可通过测量检测纠缠。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>纠缠见证是一个厄米算符 W，对所有可分态期望非负，对某些纠缠态为负，从而可通过测量检测纠缠。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathrm{tr}(W\\rho)&lt;0,\\quad \\mathrm{tr}(W\\sigma)\\ge0\\ \\forall\\sigma\\ \\text{可分}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由可分态凸集的分离超平面定理保证每个纠缠态都存在见证；W 可分解为局域测量组合。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实验上无需态层析即可检测纠缠，节约测量资源。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一个见证只能检测部分纠缠态，需针对目标态设计。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Horodecki 等 1996 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>见证的测量可用局域 Pauli 基展开，适配实验装置。</p></section></div>`}]},{name:'2.2 纠缠度量',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c2s2-1',name:'纠缠熵',tags:["def", "thm", "der", "app", "note"],brief:'对两体纯态，纠缠熵定义为任一子系统约化态的 von Neumann 熵，是纠缠的唯一合理度量（在 LOCC 单调等公理下…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对两体纯态，纠缠熵定义为任一子系统约化态的 von Neumann 熵，是纠缠的唯一合理度量（在 LOCC 单调等公理下）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(|\\psi\\rangle_{AB})=S(\\rho_A)=-\\mathrm{tr}\\rho_A\\log_2\\rho_A$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 Schmidt 系数 E=−Σλ_i log₂λ_i；最大纠缠态 E=1（两比特），直积态 E=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量化纠缠资源，计算隐形传态与密集编码的容量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>仅适用于纯态；混合态需用形成纠缠、蒸馏纠缠等推广。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>纠缠熵与热力学熵形式相同，但含义不同。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>纯态的纠缠熵在 LOCC 下不增，是可蒸馏纠缠的精确度量。</p></section></div>`},{id:'quantum_information-c2s2-2',name:'形成纠缠与蒸馏纠缠',tags:["def", "thm", "der", "app", "note"],brief:'形成纠缠是制备该态所需的最大纠缠纯态数，蒸馏纠缠是从中可提取的 Bell 态数；一般 E_D≤E_F。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>形成纠缠是制备该态所需的最大纠缠纯态数，蒸馏纠缠是从中可提取的 Bell 态数；一般 E_D≤E_F。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E_F(\\rho)=\\min\\sum_i p_i S(\\rho_A^{(i)}),\\quad E_D=\\sup\\frac{m}{n}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>E_F 定义为所有纯态系综分解中平均纠缠熵的最小值；E_D 由 n 份 ρ 经 LOCC 得到 m 个 Bell 态的比率上确界。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量化混合态纠缠的制备成本与可用价值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>存在 E_D=0 但 E_F>0 的 bound entangled 态，纠缠不可蒸馏。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 等 1996 年提出纠缠蒸馏。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>两比特态有 E_D=E_F 的解析公式（Wootters）。</p></section></div>`},{id:'quantum_information-c2s2-3',name:'并发度与 monogamy',tags:["def", "thm", "der", "app", "note"],brief:'并发度是两比特纠缠的解析度量，由 Wootters 给出；它满足 monogamy 不等式，刻画纠缠的不可自由分享性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>并发度是两比特纠缠的解析度量，由 Wootters 给出；它满足 monogamy 不等式，刻画纠缠的不可自由分享性。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C(\\rho)=\\max\\{0,\\lambda_1-\\lambda_2-\\lambda_3-\\lambda_4\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>λ_i 为 √(√ρ ρ̃ √ρ) 的本征值降序，ρ̃=(σ_y⊗σ_y)ρ*(σ_y⊗σ_y) 为自旋翻转态。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量化两比特纠缠，研究多体纠缠分配与量子密码安全性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>C=0 等价于可分，C=1 为最大纠缠。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Wootters 1998 年提出并发度。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>monogamy：C²(A:BC)≥C²(A:B)+C²(A:C)，纠缠不能被多方同时最大化共享。</p></section></div>`},{id:'quantum_information-c2s2-4',name:'纠缠面积律',tags:["def", "thm", "der", "app", "note"],brief:'多体系统基态的纠缠熵通常按区域边界面积而非体积增长，称为面积律，反映基态纠缠的结构性限制。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>多体系统基态的纠缠熵通常按区域边界面积而非体积增长，称为面积律，反映基态纠缠的结构性限制。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S_A\\ \\propto\\ \\mathrm{Area}(\\partial A)\\ \\text{（基态）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>局域哈密顿量基态的低能有效理论使跨越边界的纠缠主要来自边界附近，体内关联指数衰减。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>张量网络（MPS、PEPS）可高效表示满足面积律的态，是数值方法的基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>临界系统在一维呈对数修正 S∼(c/3)ln L；体积律对应热态或随机态。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Area law 猜想由 Bombelli 等 1986 年在黑洞熵语境提出，后在凝聚态中系统研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>面积律也是全息纠缠熵（Ryu-Takayanagi）的核心。</p></section></div>`}]},{name:'2.3 非局域性',color:'#0f766e',desc:'',items:[{id:'quantum_information-c2s3-1',name:'Bell 定理',tags:["def", "thm", "der", "app", "note"],brief:'Bell 定理指出：任何局域实在论模型都使某些关联测量满足不等式，而量子力学预言违反它，因此局域隐变量无法复现量子力学。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>Bell 定理指出：任何局域实在论模型都使某些关联测量满足不等式，而量子力学预言违反它，因此局域隐变量无法复现量子力学。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{局域隐变量}\\ \\Rightarrow\\ \\text{满足 Bell 不等式}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>构造两方两组测量设置，局域隐变量下关联函数可写成对隐变量的积分，逐项展开得 |S|≤2；量子态取合适角度得 2√2。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>把哲学争论转为可实验判决的物理命题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>实验需同时关闭局域性漏洞与探测效率漏洞，2015 年后已实现。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bell 1964 年发表。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Bell 定理不依赖量子力学的具体形式，只依赖测量统计。</p></section></div>`},{id:'quantum_information-c2s3-2',name:'CHSH 量与 Tsirelson 界',tags:["def", "thm", "der", "app", "note"],brief:'CHSH 量 S 的经典上界为 2，量子力学允许到 2√2（Tsirelson 界），一般无信号理论可达 4。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>CHSH 量 S 的经典上界为 2，量子力学允许到 2√2（Tsirelson 界），一般无信号理论可达 4。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$2\\ \\text{（经典）}\\ &lt;\\ |S|\\le 2\\sqrt2\\ \\text{（量子）}\\ \\le 4\\ \\text{（一般无信号）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用量子算符的范数与对易/反对易关系，可证 S²≤4I+[A,A′][B,B′] 的界，取最大值得 2√2。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>设备无关量子密钥分发与随机性认证的安全判据。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>实验测得 S>2 即证明非局域性，无需信任测量装置。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Tsirelson 1980 年证明量子上界。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>PR 盒可达到 4，是超越量子力学的假想资源。</p></section></div>`},{id:'quantum_information-c2s3-3',name:'GHZ 悖论',tags:["def", "thm", "der", "app", "note"],brief:'GHZ 态用三方的确定性关联给出无不等式的非局域性证明：局域实在论要求某些测量结果满足乘积关系，而量子预言矛盾。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>GHZ 态用三方的确定性关联给出无不等式的非局域性证明：局域实在论要求某些测量结果满足乘积关系，而量子预言矛盾。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|GHZ\\rangle=\\frac{|000\\rangle+|111\\rangle}{\\sqrt2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对 GHZ 态测 XYY、YXY、YYX 的乘积为 +1，而 XXX 为 −1；局域隐变量赋值无法同时满足。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>多体非局域性的典型例子，用于多方量子密码与网络非局域性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>GHZ 态的纠缠对粒子丢失极敏感，W 态更鲁棒。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Greenberger、Horne、Zeilinger 1989 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>GHZ 态是测量型量子计算与纠错的重要资源。</p></section></div>`},{id:'quantum_information-c2s3-4',name:'设备无关与自检验',tags:["def", "thm", "der", "app", "note"],brief:'达到 Tsirelson 界的 Bell 违反可自检验（self-test）测量装置与量子态，无需信任硬件，是设备无关量…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>达到 Tsirelson 界的 Bell 违反可自检验（self-test）测量装置与量子态，无需信任硬件，是设备无关量子信息的基础。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{观测到的 Bell 违反}\\ \\Rightarrow\\ \\text{态与测量的自检验}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 CHSH 最大值唯一确定测量基与最大纠缠态（在局域等距意义下），从而可认证设备行为。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>设备无关量子密钥分发、随机数生成与量子验证。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>自检验要求达到理论最大值，实验中需高保真度与低统计误差。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Mayers 与 Yao 1998、McKague 等 2012 年建立自检验理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>设备无关框架是量子密码最高安全等级的理论基础。</p></section></div>`}]}]},
{id:'quantum_information-ch3',num:'第3章',title:'量子通信',en:'QUANTUM COMMUNICATION',sub:'隐形传态 · QKD · 量子中继',desc:'',sections:[{name:'3.1 隐形传态与密集编码',color:'#2563eb',desc:'',items:[{id:'quantum_information-c3s1-1',name:'量子隐形传态',tags:["def", "thm", "der", "app", "note"],brief:'借助预先共享的纠缠与两比特经典通信，把未知量子态从一方传输到另一方，传输的是态而非粒子。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>借助预先共享的纠缠与两比特经典通信，把未知量子态从一方传输到另一方，传输的是态而非粒子。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\psi\\rangle_1\\otimes|\\Phi^+\\rangle_{23}\\ \\to\\ |\\Phi^+\\rangle_{12}\\otimes|\\psi\\rangle_3$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对 1、2 号粒子做 Bell 测量，得到四个结果之一；把结果（2 比特经典信息）告知接收方，接收方施加相应 Pauli 校正即恢复 |ψ⟩。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子网络、分布式量子计算、量子中继的核心协议。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须消耗一个 Bell 态并传输 2 比特经典信息，不违反不可克隆定理与光速限制。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 等 1993 年提出；1997 年实验实现。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>连续变量版本用压缩态与零差探测实现。</p></section></div>`},{id:'quantum_information-c3s1-2',name:'隐形传态的推导',tags:["def", "thm", "der", "app", "note"],brief:'把待传态与纠缠态的张量积按 Bell 基展开，可直接读出测量结果与接收方所需校正的对应关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把待传态与纠缠态的张量积按 Bell 基展开，可直接读出测量结果与接收方所需校正的对应关系。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\psi\\rangle_1|\\Phi^+\\rangle_{23}=\\frac12\\sum_{k=0}^{3}|\\Phi_k\\rangle_{12}\\,\\sigma_k|\\psi\\rangle_3$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用 Bell 基的完备性与 Pauli 矩阵的完备性，把三体态重写为四项之和，每项对应一个 Bell 测量结果。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>给出协议的成功概率为 1（理想情形）与校正规则。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>推导表明量子信息被「拆分」为经典结果与量子校正两部分。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 等 1993 年原文给出该分解。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该展开也是密集编码与纠缠交换计算的基础。</p></section></div>`},{id:'quantum_information-c3s1-3',name:'超密编码',tags:["def", "thm", "der", "app", "note"],brief:'预先共享一个 Bell 态，发送方仅通过对自己的粒子施加四种 Pauli 操作之一，即可向接收方传递 2 比特经典信息，…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>预先共享一个 Bell 态，发送方仅通过对自己的粒子施加四种 Pauli 操作之一，即可向接收方传递 2 比特经典信息，只需传输 1 个量子比特。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{1 qubit}\\ \\to\\ \\text{2 bits}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>四个 Pauli 操作把 |Φ⁺⟩ 变为四个正交 Bell 态，接收方做 Bell 测量即可区分，读出 2 比特。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展示纠缠可提升经典信道容量，是量子通信的基本原语。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>容量上限为 2 比特/纠缠比特，即 Holevo 界在纠缠辅助下的体现。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 与 Wiesner 1992 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>密集编码的容量等于信道的纠缠辅助经典容量。</p></section></div>`},{id:'quantum_information-c3s1-4',name:'保真度与通信质量',tags:["def", "thm", "der", "app", "note"],brief:'保真度衡量两个量子态的接近程度，是评价隐形传态、信道与量子门质量的统一指标。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>保真度衡量两个量子态的接近程度，是评价隐形传态、信道与量子门质量的统一指标。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$F(\\rho,\\sigma)=\\left(\\mathrm{tr}\\sqrt{\\sqrt\\rho\\,\\sigma\\sqrt\\rho}\\right)^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>纯态情形 F=|⟨ψ|φ⟩|²；一般情形由 Uhlmann 公式给出，满足 0≤F≤1，F=1 表示相同。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实验上评估传输保真度是否超过经典极限 2/3（两比特）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>保真度与迹距离满足 Fuchs-van de Graaf 不等式，可互相界定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Uhlmann 1976 年提出量子保真度。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平均保真度是量子处理器基准测试的标准指标。</p></section></div>`}]},{name:'3.2 量子密钥分发',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c3s2-1',name:'BB84 协议',tags:["def", "thm", "der", "app", "note"],brief:'BB84 用两组共轭基编码随机比特，发送方随机选基，接收方随机选基测量，后处理筛选出相同基的结果作为密钥。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>BB84 用两组共轭基编码随机比特，发送方随机选基，接收方随机选基测量，后处理筛选出相同基的结果作为密钥。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\{|0\\rangle,|1\\rangle\\}\\ \\text{与}\\ \\{|+\\rangle,|-\\rangle\\}\\ \\text{两组共轭基}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>窃听者若截获并重发，必在错误基上引入错误；通过公开比对部分比特估计误码率，超过阈值即放弃。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>无条件安全的密钥分发，是量子通信最成熟的应用。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>安全性来自不可克隆定理与测量扰动，而非计算困难假设。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 与 Brassard 1984 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>实用系统需诱骗态方法防御光子数分离攻击。</p></section></div>`},{id:'quantum_information-c3s2-2',name:'E91 与纠缠基协议',tags:["def", "thm", "der", "app", "note"],brief:'E91 用纠缠对分发密钥，通过检验 Bell 不等式是否被违反来认证信道安全，安全性分析与设备无关框架一致。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>E91 用纠缠对分发密钥，通过检验 Bell 不等式是否被违反来认证信道安全，安全性分析与设备无关框架一致。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(a,b)=\\langle \\sigma_a\\otimes\\sigma_b\\rangle,\\quad |S|>2\\ \\Rightarrow\\ \\text{安全}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>双方对各自粒子随机选基测量，公开比对部分结果估计 CHSH 量，若接近 2√2 则窃听极少，剩余关联可生成密钥。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>设备无关 QKD 的原型，安全性不依赖测量装置可信。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需要高质量纠缠源与高效率探测，实用化难度高于 BB84。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Ekert 1991 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>E91 与 BB84 在安全性证明上可统一处理。</p></section></div>`},{id:'quantum_information-c3s2-3',name:'安全性证明与误码率阈值',tags:["def", "thm", "der", "app", "note"],brief:'QKD 的安全性由信息论证明：窃听者获得的信息随误码率上升而增加，超过阈值时安全密钥率为零。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>QKD 的安全性由信息论证明：窃听者获得的信息随误码率上升而增加，超过阈值时安全密钥率为零。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$e\\ \\le\\ e_{\\text{th}}\\approx 11\\%\\ \\text{（BB84 渐近）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用平滑熵与不确定性关系界定窃听者信息上界，结合隐私放大把部分安全密钥压缩为完全安全密钥。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定实际系统可容忍的噪声与损耗，指导硬件指标。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>有限码长效应使实际阈值低于渐近值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Shor-Preskill 2000 年给出 BB84 的简洁安全性证明。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>测量设备无关 QKD 进一步提高阈值与实用性。</p></section></div>`},{id:'quantum_information-c3s2-4',name:'诱骗态与测量设备无关 QKD',tags:["def", "thm", "der", "app", "note"],brief:'诱骗态方法通过随机改变光强估计单光子脉冲的增益与误码率，抵御光子数分离攻击；MDI-QKD 则把测量交给不可信第三方。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>诱骗态方法通过随机改变光强估计单光子脉冲的增益与误码率，抵御光子数分离攻击；MDI-QKD 则把测量交给不可信第三方。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{诱骗态}\\ \\Rightarrow\\ \\text{估计单光子贡献}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>弱相干光源含多光子成分，窃听者可分光子；诱骗态使合法方能在不假设光源理想的情况下下界单光子安全性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实用光纤 QKD 系统的标准配置，推动城际与城域网络部署。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>MDI-QKD 的安全性只依赖探测器的线性光学特性，可容忍探测端被攻破。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Hwang 2003 年提出诱骗态；Lo、Curty、Qi 2012 年提出 MDI-QKD。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>双场 QKD 进一步突破线性损耗界，延长传输距离。</p></section></div>`}]},{name:'3.3 量子中继与网络',color:'#0f766e',desc:'',items:[{id:'quantum_information-c3s3-1',name:'纠缠交换与中继',tags:["def", "thm", "der", "app", "note"],brief:'量子中继把长距离信道分成若干段，每段建立纠缠后通过纠缠交换拼接，克服光纤损耗的指数衰减。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子中继把长距离信道分成若干段，每段建立纠缠后通过纠缠交换拼接，克服光纤损耗的指数衰减。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{分段纠缠}\\ \\to\\ \\text{Bell 测量}\\ \\to\\ \\text{端到端纠缠}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>相邻节点先分发纠缠对并存储于量子存储器，再做 Bell 测量把相邻段连接，逐级扩展距离。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构建洲际量子密钥分发与全量子互联网。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需要长相干量子存储器与高效率纠缠接口，是工程难点。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Briegel 等 1998 年提出量子中继方案。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>纠缠交换是 3.1 节的协议，在中继中反复使用。</p></section></div>`},{id:'quantum_information-c3s3-2',name:'量子存储器',tags:["def", "thm", "der", "app", "note"],brief:'量子存储器需在建立纠缠与使用之间保持量子态相干，是量子中继与量子网络的关键器件。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子存储器需在建立纠缠与使用之间保持量子态相干，是量子中继与量子网络的关键器件。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{存储时间}\\ \\gg\\ \\text{纠缠分发时间}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>常用原子系综、稀土掺杂晶体、单光子腔等实现，指标为存储时间、效率与保真度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>同步多节点纠缠、实现量子网络的异步操作。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>存储时间与效率存在权衡，需满足中继的时序要求。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Cirac 等 1997 年提出量子存储器与量子网络的结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多模存储可并行处理多路纠缠，提高网络吞吐。</p></section></div>`},{id:'quantum_information-c3s3-3',name:'量子网络与卫星 QKD',tags:["def", "thm", "der", "app", "note"],brief:'卫星平台利用自由空间信道降低损耗，实现跨洲际量子密钥分发；地面光纤网络则面向城域与骨干网。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>卫星平台利用自由空间信道降低损耗，实现跨洲际量子密钥分发；地面光纤网络则面向城域与骨干网。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{自由空间损耗}\\ \\sim\\ 1/r^2\\ \\text{优于光纤指数损耗}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>星地链路在大气窗口波段传输，配合地面站与可信中继或卫星纠缠源，实现千公里级密钥分发。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构建全球量子通信网络，服务政务、金融等高安全场景。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>夜间观测、天气与对准精度是主要限制。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>中国「墨子号」2016 年发射，实现星地 QKD 与纠缠分发。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>未来方向是全量子网络与量子互联网协议栈。</p></section></div>`},{id:'quantum_information-c3s3-4',name:'量子网络的协议栈',tags:["def", "thm", "der", "app", "note"],brief:'量子网络需要分层协议：物理层分发纠缠，链路层做纠缠交换与纯化，网络层路由纠缠，应用层运行 QKD、分布式计算等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子网络需要分层协议：物理层分发纠缠，链路层做纠缠交换与纯化，网络层路由纠缠，应用层运行 QKD、分布式计算等。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{物理层}\\to\\text{链路层}\\to\\text{网络层}\\to\\text{应用层}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>类比经典互联网，但量子态不可克隆，路由与存储需重新设计；纠缠纯化用于提升链路保真度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一异构量子设备的互操作，支撑规模化量子互联网。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子中继与存储的工程成熟度决定网络规模。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Wehner、Elkouss、Hanson 2018 年提出量子互联网愿景。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>分布式量子计算可视为网络的高阶应用。</p></section></div>`}]}]},
{id:'quantum_information-ch4',num:'第4章',title:'量子信道',en:'QUANTUM CHANNELS',sub:'噪声模型 · 信道容量 · 编码定理',desc:'',sections:[{name:'4.1 噪声信道模型',color:'#2563eb',desc:'',items:[{id:'quantum_information-c4s1-1',name:'退极化信道',tags:["def", "thm", "der", "app", "note"],brief:'退极化信道以概率 p 用随机 Pauli 错误替换态，是最常用的各向同性噪声模型。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>退极化信道以概率 p 用随机 Pauli 错误替换态，是最常用的各向同性噪声模型。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}(\\rho)=(1-p)\\rho+\\frac{p}{3}(X\\rho X+Y\\rho Y+Z\\rho Z)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等价于以概率 p 把态替换为完全混合态：E(ρ)=(1−4p/3)ρ+(4p/3)I/2（单比特）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>建模超导与光学平台的均匀噪声，简化纠错阈值分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>退极化信道是最对称的信道，其容量有解析结果。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>又称白噪声信道，在量子信息文献中广泛使用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>组合 n 个退极化信道可分析纠错的阈值行为。</p></section></div>`},{id:'quantum_information-c4s1-2',name:'振幅阻尼与相位阻尼',tags:["def", "thm", "der", "app", "note"],brief:'振幅阻尼描述能量耗散（如自发辐射），相位阻尼描述无能量损失的退相干（如散射引起的相位随机化）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>振幅阻尼描述能量耗散（如自发辐射），相位阻尼描述无能量损失的退相干（如散射引起的相位随机化）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}_{\\text{AD}}:\\ E_0=\\begin{pmatrix}1&0\\\\0&\\sqrt{1-\\gamma}\\end{pmatrix},\\ E_1=\\begin{pmatrix}0&\\sqrt\\gamma\\\\0&0\\end{pmatrix}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>振幅阻尼的 Kraus 算符由 |1⟩→|0⟩ 的跃迁概率 γ 给出；相位阻尼使 |1⟩ 获得随机相位，密度矩阵非对角元按 e^{−γ} 衰减。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>建模真实的原子、超导比特与光纤信道。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>振幅阻尼的稳态是 |0⟩，相位阻尼不改变布洛赫矢量 z 分量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>这两种信道是量子光学中的标准模型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>T1 对应振幅阻尼，T2 对应相位阻尼与 T1 的综合。</p></section></div>`},{id:'quantum_information-c4s1-3',name:'比特翻转与相位翻转信道',tags:["def", "thm", "der", "app", "note"],brief:'比特翻转信道以概率 p 施加 X 错误，相位翻转信道以概率 p 施加 Z 错误，是最基础的离散噪声模型。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>比特翻转信道以概率 p 施加 X 错误，相位翻转信道以概率 p 施加 Z 错误，是最基础的离散噪声模型。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}(\\rho)=(1-p)\\rho+p\\,X\\rho X$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两者都是 Pauli 信道的特例；任意 Pauli 信道可写成 ρ→Σp_iP_iρP_i。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>纠错码的入门模型，三比特码正是针对它们设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Pauli 信道与退极化信道的关系由 p 的归一化方式决定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Shor 1995 年以比特翻转与相位翻转说明量子纠错。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Pauli 信道可用经典二元对称信道分析其错误模式。</p></section></div>`},{id:'quantum_information-c4s1-4',name:'信道的组合与级联',tags:["def", "thm", "der", "app", "note"],brief:'多个信道串联仍构成合法量子信道，这保证噪声模型可逐级叠加，也是级联纠错的理论基础。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>多个信道串联仍构成合法量子信道，这保证噪声模型可逐级叠加，也是级联纠错的理论基础。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{E}_2\\circ\\mathcal{E}_1\\ \\text{仍为完全正保迹映射}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>Kraus 算符相乘并重新组合，或用 Choi 矩阵的复合公式；信道复合对应 Choi 矩阵的矩阵乘积。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析多级噪声、级联码与网络链路的端到端性能。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>信道复合一般不可交换，顺序影响结果。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Choi 1975 年引入 Choi 矩阵表示信道。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>级联码正是信道复合与纠错的结合。</p></section></div>`}]},{name:'4.2 信道容量',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c4s2-1',name:'经典容量',tags:["def", "thm", "der", "app", "note"],brief:'量子信道传输经典信息的容量由 Holevo 量 χ 的最大值给出，这是 HSW 定理的结论。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子信道传输经典信息的容量由 Holevo 量 χ 的最大值给出，这是 HSW 定理的结论。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C(\\mathcal{E})=\\max_{\\{p_i,\\rho_i\\}}\\ \\chi\\big(\\{p_i,\\mathcal{E}(\\rho_i)\\}\\big)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>χ=S(Σp_iE(ρ_i))−Σp_iS(E(ρ_i))，即输出系综的 Holevo 信息；编码需在多次使用信道时联合测量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定量子信道作为经典通信链路的能力上限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>单次使用与多次使用容量一般不同，需正则化 C∞。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Holevo、Schumacher、Westmoreland 1997 年证明 HSW 定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对退极化信道，经典容量在 p 较小时为正，p 大时降为零。</p></section></div>`},{id:'quantum_information-c4s2-2',name:'量子容量',tags:["def", "thm", "der", "app", "note"],brief:'量子容量是信道可靠传输量子信息（保真纠缠）的最大速率，由相干信息 I_c 的正则化给出。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子容量是信道可靠传输量子信息（保真纠缠）的最大速率，由相干信息 I_c 的正则化给出。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Q(\\mathcal{E})=\\lim_{n\\to\\infty}\\frac{1}{n}\\max_{\\rho}\\ I_c(\\rho,\\mathcal{E}^{\\otimes n})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>相干信息 I_c(ρ,E)=S(E(ρ))−S((E⊗I)(|Ψ⟩⟨Ψ|))，其中 |Ψ⟩ 为 ρ 的纯化；量子容量等于其正则化最大值。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定量子中继、量子网络与量子存储的通信速率上限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子容量可为 0 而经典容量为正（如某些反退化信道）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Lloyd 1997、Shor 2002、Devetak 2005 建立量子容量定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>LSD 定理把量子容量与纠缠蒸馏、私密经典容量统一。</p></section></div>`},{id:'quantum_information-c4s2-3',name:'HSW 定理',tags:["def", "thm", "der", "app", "note"],brief:'HSW 定理证明量子信道的经典容量等于 Holevo 量的正则化，是量子 Shannon 理论的核心结果。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>HSW 定理证明量子信道的经典容量等于 Holevo 量的正则化，是量子 Shannon 理论的核心结果。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{经典信息速率}\\ \\le\\ \\chi,\\quad \\text{可达}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>编码用典型序列与随机编码，解码用集体测量；正命题由随机编码与 Holevo 界，逆命题由 Holevo 界给出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>为量子通信系统设计提供理论基准。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>可达性依赖长码与联合测量，实际系统受限于器件。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Holevo 1998、Schumacher-Westmoreland 1997。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>HSW 定理是量子信息论与经典信息论的桥梁。</p></section></div>`},{id:'quantum_information-c4s2-4',name:'LSD 定理与相干信息',tags:["def", "thm", "der", "app", "note"],brief:'LSD 定理把量子容量、纠缠辅助经典容量与私密经典容量统一为相干信息的正则化，是量子 Shannon 理论的顶峰。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>LSD 定理把量子容量、纠缠辅助经典容量与私密经典容量统一为相干信息的正则化，是量子 Shannon 理论的顶峰。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Q(\\mathcal{E})=\\lim\\frac1n\\max_\\rho I_c(\\rho,\\mathcal{E}^{\\otimes n})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>相干信息度量信道保持与参考系统纠缠的能力；通过纠缠纯化、量子数据压缩与私密放大实现可达性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一理解量子通信的三类任务，指导协议设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正则化使容量计算困难，仅少数信道有解析解。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Lloyd 1997、Shor 2002、Devetak 2005 共同建立。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对退极化信道，量子容量在 p 低于约 0.19 时为正。</p></section></div>`}]}]},
{id:'quantum_information-ch5',num:'第5章',title:'量子纠错码',en:'QUANTUM CODES',sub:'错误离散化 · 稳定子 · 表面码',desc:'',sections:[{name:'5.1 纠错原理',color:'#2563eb',desc:'',items:[{id:'quantum_information-c5s1-1',name:'量子纠错的困难',tags:["def", "thm", "der", "app", "note"],brief:'经典纠错靠复制比特并多数表决，但量子态不可克隆、测量会破坏叠加，因此量子纠错必须用编码而非复制。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>经典纠错靠复制比特并多数表决，但量子态不可克隆、测量会破坏叠加，因此量子纠错必须用编码而非复制。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{不可克隆}+\\text{测量坍缩}\\ \\Rightarrow\\ \\text{不能简单重复}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把逻辑信息非局域地分散到多个物理比特的纠缠态中，使局域错误不破坏逻辑信息，再用综合征测量定位错误。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实现可扩展量子计算的前提。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>编码态必须是纠缠态，这与经典重复码形成鲜明对比。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Shor 1995 年突破「量子纠错不可能」的直觉。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子纠错与经典纠错的核心差异在于错误是连续的且测量有破坏性。</p></section></div>`},{id:'quantum_information-c5s1-2',name:'错误离散化',tags:["def", "thm", "der", "app", "note"],brief:'任意连续错误都可用 Pauli 基展开，综合征测量使错误坍缩到某一 Pauli 算符，因此只需纠正离散错误。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任意连续错误都可用 Pauli 基展开，综合征测量使错误坍缩到某一 Pauli 算符，因此只需纠正离散错误。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sum_i E_i\\rho E_i^{\\dagger}\\ \\xrightarrow{\\text{综合征}}\\ \\text{某 }P\\in\\{I,X,Y,Z\\}^{\\otimes n}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>测量稳定子后，错误被投影到某个 Pauli 本征空间，连续参数被「数字化」，这是纠错可行的关键。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化码的设计与分析，使纠错只需处理有限种错误。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>若一个块内错误数超过纠错能力，纠正会失败甚至引入逻辑错误。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Knill 与 Laflamme 1997 年强调该性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>离散化是阈值定理证明的核心步骤。</p></section></div>`},{id:'quantum_information-c5s1-3',name:'编码与恢复',tags:["def", "thm", "der", "app", "note"],brief:'量子纠错码由编码 map、噪声信道与恢复 map 组成，要求复合后接近恒等映射。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子纠错码由编码 map、噪声信道与恢复 map 组成，要求复合后接近恒等映射。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{R}\\circ\\mathcal{N}\\circ\\mathcal{E}\\approx\\mathrm{id}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>编码把 k 个逻辑比特嵌入 n 个物理比特；恢复由综合征测量与相应纠正操作构成，满足 Knill-Laflamme 条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>设计码与解码器，评估逻辑错误率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>恢复不必完美，只需把错误压制到阈值以下。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Knill 与 Laflamme 1997 年给出纠错条件。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>近似量子纠错可放宽精确恢复条件，提高码率。</p></section></div>`},{id:'quantum_information-c5s1-4',name:'量子 Hamming 界',tags:["def", "thm", "der", "app", "note"],brief:'量子 Hamming 界给出纠正 t 个错误所需的冗余下界，是码参数的基本限制。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子 Hamming 界给出纠正 t 个错误所需的冗余下界，是码参数的基本限制。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$2^{n-k}\\ \\ge\\ \\sum_{j=0}^{t}\\binom{n}{j}3^{j}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>每个错误位置有 3 种 Pauli 类型（X、Y、Z），可纠正错误总数不能超过综合征空间维数 2^{n−k}。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断给定 [[n,k,d]] 码是否最优，指导码的搜索。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>达到等号的码称完备码，量子情形极少（如五比特码）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>量子 Hamming 界由 Knill、Laflamme 等建立。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>此外还有 Singleton 界与量子 Gilbert-Varshamov 界。</p></section></div>`}]},{name:'5.2 稳定子码与 CSS',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c5s2-1',name:'稳定子码',tags:["def", "thm", "der", "app", "note"],brief:'稳定子码由相互对易的 Pauli 生成元定义，码空间为其公共 +1 本征空间，是量子纠错最通用的代数框架。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>稳定子码由相互对易的 Pauli 生成元定义，码空间为其公共 +1 本征空间，是量子纠错最通用的代数框架。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathcal{C}=\\{|\\psi\\rangle:S_i|\\psi\\rangle=|\\psi\\rangle\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>n−k 个独立生成元确定 2^k 维码空间；错误 E 若与生成元反对易则产生非平凡综合征。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一构造与解码 CSS 码、表面码、量子 LDPC 码。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>生成元必须对易且线性独立，否则码空间维数不符。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Gottesman 1996 年建立稳定子理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>稳定子码可用 GF(2) 上的辛矩阵高效表示与计算。</p></section></div>`},{id:'quantum_information-c5s2-2',name:'综合征与错误定位',tags:["def", "thm", "der", "app", "note"],brief:'错误与各稳定子生成元的对易/反对易模式构成综合征，用于定位错误类型与位置。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>错误与各稳定子生成元的对易/反对易模式构成综合征，用于定位错误类型与位置。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$s_i=\\begin{cases}0,&[E,S_i]=0\\\\1,&\\{E,S_i\\}=0\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>综合征是 n−k 位二元串；对可纠正错误集合，不同错误对应不同综合征，故可唯一恢复。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解码器据此查表或用匹配算法恢复。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>综合征本身不泄露逻辑信息，因此测量不破坏编码态。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Shor 1995、Steane 1997 给出测量方案。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>表面码用综合征的几何结构设计高效解码器。</p></section></div>`},{id:'quantum_information-c5s2-3',name:'CSS 码',tags:["def", "thm", "der", "app", "note"],brief:'CSS 码由两个经典线性码构造，把比特翻转与相位翻转分开处理，是量子纠错与经典编码理论的桥梁。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>CSS 码由两个经典线性码构造，把比特翻转与相位翻转分开处理，是量子纠错与经典编码理论的桥梁。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_2^{\\perp}\\subseteq C_1\\ \\Rightarrow\\ [[n,k,d]]\\ \\text{CSS 码}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>X 型稳定子来自 C1 的对偶码，Z 型来自 C2；条件 C2⊥⊆C1 保证 X 与 Z 稳定子对易。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构造高码率码、实现横向逻辑门，便于容错。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Steane 七比特码是 [[7,1,3]] CSS 码，可纠正任意单比特错误。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Calderbank-Shor 1996、Steane 1996 独立提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>CSS 码的横向 CNOT 与 H 门天然容错。</p></section></div>`},{id:'quantum_information-c5s2-4',name:'五比特完美码',tags:["def", "thm", "der", "app", "note"],brief:'五比特码是最小的能纠正任意单比特错误的量子码，达到量子 Hamming 界，是唯一的 [[5,1,3]] 完备码。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>五比特码是最小的能纠正任意单比特错误的量子码，达到量子 Hamming 界，是唯一的 [[5,1,3]] 完备码。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$[[5,1,3]]:\\ 2^{5-1}=16=\\sum_{j=0}^{1}\\binom{5}{j}3^{j}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>四个稳定子生成元定义码空间；与九比特码相比，它用最少比特实现同样纠错能力，但无横向逻辑门。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>理论上的重要基准，说明量子纠错的最小资源需求。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>编码效率高但容错实现困难，需额外技巧实现通用门。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Laflamme 等 1996、Bennett 等 1996 独立提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>五比特码的循环结构使其在实验上较易实现。</p></section></div>`}]},{name:'5.3 表面码与容错',color:'#0f766e',desc:'',items:[{id:'quantum_information-c5s3-1',name:'环面码与表面码',tags:["def", "thm", "der", "app", "note"],brief:'Kitaev 环面码把比特放在方格边上，顶点与面心分别定义 X 型与 Z 型稳定子，是拓扑序与拓扑纠错的典范。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>Kitaev 环面码把比特放在方格边上，顶点与面心分别定义 X 型与 Z 型稳定子，是拓扑序与拓扑纠错的典范。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$H=-\\sum_{v}A_v-\\sum_{p}B_p$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>基态满足所有稳定子为 +1；激发为任意子（e 与 m），逻辑算符是绕环面的非收缩链，码距等于最短链长。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表面码（平面版本）是当前超导量子计算最可能的容错方案。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>阈值约 1%，逻辑错误率随码距指数下降。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Kitaev 1997 年提出环面码。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>表面码需边界处理，逻辑比特定义在边界之间。</p></section></div>`},{id:'quantum_information-c5s3-2',name:'解码算法',tags:["def", "thm", "der", "app", "note"],brief:'表面码的综合征表现为任意子对，解码即找最可能的错误链把任意子配对，常用最小权完美匹配算法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>表面码的综合征表现为任意子对，解码即找最可能的错误链把任意子配对，常用最小权完美匹配算法。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{最小权完美匹配（MWPM）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>构造任意子间的距离图，用 Blossom 算法求最小权匹配，再施加相应纠正链；Union-Find 解码更快但略次优。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实时解码是容错运行的瓶颈之一，需与量子线路并行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>解码性能直接决定有效阈值与逻辑错误率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Fowler 等 2012 年系统评估表面码解码。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>机器学习解码器与神经网络解码是近年热点。</p></section></div>`},{id:'quantum_information-c5s3-3',name:'阈值定理',tags:["def", "thm", "der", "app", "note"],brief:'阈值定理保证：只要物理错误率低于阈值，通过增大码距即可把逻辑错误率压到任意低，量子计算因而可扩展。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>阈值定理保证：只要物理错误率低于阈值，通过增大码距即可把逻辑错误率压到任意低，量子计算因而可扩展。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$p&lt;p_{\\text{th}}\\ \\Rightarrow\\ p_L\\to0\\ \\text{（码距增大）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>容错门与综合征提取保证错误不扩散；级联或表面码使逻辑错误率随码距指数下降，条件是 p<p_th。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子计算可行性的理论基石，指导硬件保真度目标。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>阈值依赖噪声模型与解码器，典型 10⁻³–10⁻²。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Aharonov-Ben-Or 1997、Kitaev 1997、Knill-Laflamme-Zurek 1998。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>qLDPC 码可在保持阈值的同时大幅降低开销。</p></section></div>`},{id:'quantum_information-c5s3-4',name:'容错与魔态蒸馏',tags:["def", "thm", "der", "app", "note"],brief:'Clifford 门可横向实现而天然容错，非 Clifford 的 T 门需通过魔态蒸馏与注入实现，从而获得通用容错量子…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>Clifford 门可横向实现而天然容错，非 Clifford 的 T 门需通过魔态蒸馏与注入实现，从而获得通用容错量子计算。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{Clifford 横向}\\ +\\ \\text{魔态注入}\\ \\Rightarrow\\ \\text{通用容错}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>蒸馏用多个低保真 |T⟩ 经 Clifford 操作与测量提纯；注入用门隐形传态把 T 作用到数据比特，避免错误扩散。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实现通用容错线路的关键工程环节。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>魔态工厂消耗大量物理比特与时间，是资源估计的主要部分。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bravyi 与 Kitaev 2005 年提出魔态蒸馏。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>码切换与横向 T 门是替代路线。</p></section></div>`}]}]},
{id:'quantum_information-ch6',num:'第6章',title:'量子熵与信息论',en:'QUANTUM ENTROPY',sub:'von Neumann 熵 · 互信息 · Holevo 界',desc:'',sections:[{name:'6.1 von Neumann 熵',color:'#2563eb',desc:'',items:[{id:'quantum_information-c6s1-1',name:'von Neumann 熵',tags:["def", "thm", "der", "app", "note"],brief:'von Neumann 熵是量子态不确定性的度量，是 Shannon 熵在密度算符上的推广，本征值即概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>von Neumann 熵是量子态不确定性的度量，是 Shannon 熵在密度算符上的推广，本征值即概率。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S(\\rho)=-\\mathrm{tr}(\\rho\\log_2\\rho)=-\\sum_i\\lambda_i\\log_2\\lambda_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对纯态 S=0，对 d 维完全混合态 S=log₂d；S 在幺正演化下不变。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量化纠缠、信道容量、热力学与信息的关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>S(ρ) 只依赖 ρ 的本征值，与基无关。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>von Neumann 1927 年引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>S 是密度算符的凹函数，满足 Klein 不等式 S(ρ||σ)≥0。</p></section></div>`},{id:'quantum_information-c6s1-2',name:'熵的性质',tags:["def", "thm", "der", "app", "note"],brief:'von Neumann 熵非负、在凸组合下凹、对迹距离连续（Fannes-Audenaert 不等式），这些性质支撑信息…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>von Neumann 熵非负、在凸组合下凹、对迹距离连续（Fannes-Audenaert 不等式），这些性质支撑信息论证明。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S(\\rho)\\ge0,\\quad S\\ \\text{凹},\\quad |S(\\rho)-S(\\sigma)|\\le T\\log_2(d/2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>凹性由本征值的凹性得到；连续性由 Fannes 不等式界定，误差随迹距离对数增长。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明容量定理与纠缠度量的连续性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>熵不是可观测量，需态层析或随机测量估计。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Fannes 1973、Audenaert 2007 给出紧致连续性界。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>熵的凹性对应「混合增加不确定性」。</p></section></div>`},{id:'quantum_information-c6s1-3',name:'相对熵',tags:["def", "thm", "der", "app", "note"],brief:'量子相对熵度量两个态的区分程度，是证明信道容量与纠缠单调性的核心工具。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子相对熵度量两个态的区分程度，是证明信道容量与纠缠单调性的核心工具。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S(\\rho\\|\\sigma)=\\mathrm{tr}\\rho(\\log_2\\rho-\\log_2\\sigma)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>Klein 不等式 S(ρ||σ)≥0，等号当且仅当 ρ=σ；它在完全正保迹映射下单调不增。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>界定 Holevo 信息、证明数据处理不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>当 σ 的支撑不含 ρ 的支撑时相对熵为无穷。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Umegaki 1962 年定义量子相对熵。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相对熵的单调性是量子信息论最优美的性质之一。</p></section></div>`},{id:'quantum_information-c6s1-4',name:'熵与纠缠',tags:["def", "thm", "der", "app", "note"],brief:'对两体纯态，纠缠熵等于任一子系统的 von Neumann 熵，且两边相等，这是 Schmidt 分解的直接推论。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对两体纯态，纠缠熵等于任一子系统的 von Neumann 熵，且两边相等，这是 Schmidt 分解的直接推论。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(|\\psi\\rangle_{AB})=S(\\rho_A)=S(\\rho_B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两子系统的非零本征值在 Schmidt 分解中相同，故 ρ_A 与 ρ_B 的谱一致，熵相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算纯态纠缠、分析纯化与压缩。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>混合态情形 S(ρ_A)≠S(ρ_B) 可能，需用其他度量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>纠缠熵是纯态纠缠的唯一合理度量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多体面积律描述基态纠缠熵的标度行为。</p></section></div>`}]},{name:'6.2 联合熵与互信息',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c6s2-1',name:'联合熵与条件熵',tags:["def", "thm", "der", "app", "note"],brief:'联合熵是复合系统的 von Neumann 熵，条件熵由联合熵减去子系统熵定义，可为负是量子特有的现象。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>联合熵是复合系统的 von Neumann 熵，条件熵由联合熵减去子系统熵定义，可为负是量子特有的现象。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S(A,B)=S(\\rho_{AB}),\\quad S(A|B)=S(A,B)-S(B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>经典条件熵非负，但量子条件熵可负（如 Bell 态 S(A|B)=−1），反映强纠缠。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量化纠缠、信道相干信息与量子热力学。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>负条件熵是量子信息优越性的标志之一。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>量子条件熵的负性由 Horodecki 等系统研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>条件熵与相干信息直接相关。</p></section></div>`},{id:'quantum_information-c6s2-2',name:'量子互信息',tags:["def", "thm", "der", "app", "note"],brief:'量子互信息度量两子系统之间的总关联（经典加量子），是相对熵的联合态与边缘态直积之差。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子互信息度量两子系统之间的总关联（经典加量子），是相对熵的联合态与边缘态直积之差。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$I(A:B)=S(A)+S(B)-S(A,B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>I(A:B)=S(ρ_AB||ρ_A⊗ρ_B)≥0；对直积态为零，对纠缠态为正但不含经典分量区分。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量化关联、证明信道容量与纠缠蒸馏的界。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子互信息不能直接测量，需态层析或关联测量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>互信息的量子版本由 Cerf 与 Adami 等研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>互信息在局域操作下不增（数据处理不等式）。</p></section></div>`},{id:'quantum_information-c6s2-3',name:'次可加性与强次可加性',tags:["def", "thm", "der", "app", "note"],brief:'熵的次可加性与强次可加性（SSA）是量子信息论的基本不等式，后者是许多容量定理的基石。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>熵的次可加性与强次可加性（SSA）是量子信息论的基本不等式，后者是许多容量定理的基石。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S(A,B)\\le S(A)+S(B),\\quad S(A,B,C)+S(B)\\le S(A,B)+S(B,C)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>SSA 等价于条件互信息 I(A:C|B)≥0，其证明依赖相对熵的单调性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明量子信道容量、纠缠蒸馏与纠错的可能性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>SSA 的等号条件刻画态的马尔可夫性。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Lieb 与 Ruskai 1973 年证明 SSA，是量子信息论的里程碑。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>SSA 至今无初等证明，其证明用到算子凸性。</p></section></div>`},{id:'quantum_information-c6s2-4',name:'纠缠与互信息的区别',tags:["def", "thm", "der", "app", "note"],brief:'互信息包含经典关联与量子纠缠，而纠缠熵只度量纯态的量子部分；可分态可有非零互信息。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>互信息包含经典关联与量子纠缠，而纠缠熵只度量纯态的量子部分；可分态可有非零互信息。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$I(A:B)=S(A)+S(B)-S(A,B)\\ \\text{含经典关联}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>经典关联态（如均匀混合的直积态系综）互信息为正但纠缠为零。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>正确选择度量以区分经典与量子资源。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>纠缠度量需满足 LOCC 单调性，互信息不满足。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>纠缠与互信息的区分是量子信息理论的核心议题。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>纠缠蒸馏所需资源与互信息不直接对应。</p></section></div>`}]},{name:'6.3 Holevo 界与可及信息',color:'#0f766e',desc:'',items:[{id:'quantum_information-c6s3-1',name:'Holevo 量',tags:["def", "thm", "der", "app", "note"],brief:'Holevo 量给出从量子系综中可提取经典信息的上界，是编码态之间的可区分性度量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>Holevo 量给出从量子系综中可提取经典信息的上界，是编码态之间的可区分性度量。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\chi=S\\!\\left(\\sum_i p_i\\rho_i\\right)-\\sum_i p_i S(\\rho_i)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>χ 是输出态平均熵与各态熵的加权差，反映编码态的「分散程度」；正交编码可达 log₂d。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>界定量子信道经典容量与量子密钥分发的安全速率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>χ 是上界，一般不可达（除特殊信道），需集体测量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Holevo 1973 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>χ 等于系综的量子-经典互信息。</p></section></div>`},{id:'quantum_information-c6s3-2',name:'可及信息',tags:["def", "thm", "der", "app", "note"],brief:'可及信息是通过实际测量能从系综中获取的经典信息，是 Holevo 量的下界，二者一般不等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>可及信息是通过实际测量能从系综中获取的经典信息，是 Holevo 量的下界，二者一般不等。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$I_{\\text{acc}}=\\max_{\\{M_m\\}}\\ \\sum_i p_i\\log_2\\frac{p(i|m)}{p_i}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>优化所有 POVM 测量；对纯态正交系综可达 Holevo 界，对非正交系综有差距。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定实际接收机的性能上限，指导测量设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>可及信息的计算通常困难，仅特殊系综有解析解。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Holevo 界的可达性由 Schumacher-Westmoreland 等研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>集体测量可缩小可及信息与 Holevo 界的差距。</p></section></div>`},{id:'quantum_information-c6s3-3',name:'数据处理不等式',tags:["def", "thm", "der", "app", "note"],brief:'局域量子操作与经典通信不会增加互信息，这是量子信息论的基本单调性，保证信息不能被「凭空创造」。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>局域量子操作与经典通信不会增加互信息，这是量子信息论的基本单调性，保证信息不能被「凭空创造」。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$I(A:B)_{\\mathcal{E}}\\le I(A:B)_{\\rho}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由相对熵在完全正保迹映射下的单调性直接推出，取联合态与边缘态直积的相对熵。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明信道容量上界、纠缠单调性与安全性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等号条件对应可逆操作或态的特殊结构。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Lieb-Ruskai 1973 年证明相对熵单调性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>数据处理不等式是量子 Shannon 理论的支柱之一。</p></section></div>`},{id:'quantum_information-c6s3-4',name:'熵的不确定性关系',tags:["def", "thm", "der", "app", "note"],brief:'熵不确定性关系把共轭基测量结果的不确定性与系统纠缠联系起来，是量子密码安全性的核心工具。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>熵不确定性关系把共轭基测量结果的不确定性与系统纠缠联系起来，是量子密码安全性的核心工具。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$H(X)+H(Z)\\ \\ge\\ \\log_2\\frac{1}{c}\\quad(\\text{经典});\\quad H(X|B)+H(Z|B)\\ge\\log_2\\frac1c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>经典版本由 Maassen-Uffink 给出；量子版本用条件熵 H(X|B) 描述窃听者信息，B 为纠缠辅助。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明 BB84 与设备无关 QKD 的安全速率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>当 B 与系统纠缠时，条件熵可减小甚至为负，体现量子关联。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Berta 等 2010 年提出量子记忆下的熵不确定性关系。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该关系是量子密码安全性证明的基础之一。</p></section></div>`}]}]},
{id:'quantum_information-ch7',num:'第7章',title:'量子压缩与编码',en:'COMPRESSION & CODING',sub:'Schumacher 压缩 · HSW · 纠缠辅助',desc:'',sections:[{name:'7.1 Schumacher 压缩',color:'#2563eb',desc:'',items:[{id:'quantum_information-c7s1-1',name:'量子数据压缩',tags:["def", "thm", "der", "app", "note"],brief:'Schumacher 压缩把 n 份同一量子态无损压缩到约 nS(ρ) 个量子比特，是量子版的 Shannon 无噪编码…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>Schumacher 压缩把 n 份同一量子态无损压缩到约 nS(ρ) 个量子比特，是量子版的 Shannon 无噪编码定理。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho^{\\otimes n}\\ \\to\\ \\text{约 } nS(\\rho)\\ \\text{个量子比特}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把 ρ 对角化并按本征值排序，取高概率的典型子空间，投影编码；非典型子空间概率随 n 指数衰减。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子存储与传输的容量下界，指导量子存储器设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>压缩后保真度在 n→∞ 时趋于 1，但需已知 ρ 或通过训练估计。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Schumacher 1995 年提出，命名 qubit 于此文。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>压缩率由 von Neumann 熵而非 Shannon 熵决定。</p></section></div>`},{id:'quantum_information-c7s1-2',name:'典型子空间',tags:["def", "thm", "der", "app", "note"],brief:'典型子空间由典型序列构成，其维数约为 2^{nS(ρ)}，承载几乎全部概率，是压缩的几何基础。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>典型子空间由典型序列构成，其维数约为 2^{nS(ρ)}，承载几乎全部概率，是压缩的几何基础。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Pi_{\\delta}:\\ \\mathrm{tr}(\\Pi_\\delta\\rho^{\\otimes n})\\ge1-\\delta,\\quad \\dim\\Pi_\\delta\\approx2^{nS(\\rho)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由大数定律，本征值乘积在典型序列上集中在 2^{−nS}，故子空间维数指数由熵决定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构造压缩编码与证明压缩极限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>典型子空间依赖 ρ 的本征基，若 ρ 未知需先估计。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>典型性论证源自 Shannon 与 von Neumann，Schumacher 用于量子。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子典型性有多个版本（纯态典型性、完全典型性）。</p></section></div>`},{id:'quantum_information-c7s1-3',name:'压缩的保真度与速率',tags:["def", "thm", "der", "app", "note"],brief:'压缩速率高于熵时保真度趋于 1，低于熵时保真度趋于 0，形成尖锐的阈值，是量子无噪编码定理的内容。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>压缩速率高于熵时保真度趋于 1，低于熵时保真度趋于 0，形成尖锐的阈值，是量子无噪编码定理的内容。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R>S(\\rho)\\ \\Rightarrow\\ F\\to1;\\quad R&lt;S(\\rho)\\ \\Rightarrow\\ F\\to0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>编码用典型子空间投影并做等距嵌入，解码为逆映射；逆定理用保真度与维数的关系界定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定量子存储与传输的理论极限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>有限 n 时存在非零失真，需考虑有限码长效应。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Schumacher 1995；Jozsa 等给出严格证明。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>纠缠辅助压缩可进一步提升速率。</p></section></div>`},{id:'quantum_information-c7s1-4',name:'有损与纠缠辅助压缩',tags:["def", "thm", "der", "app", "note"],brief:'纠缠辅助压缩利用预共享纠缠降低压缩量子比特数，速率由互信息的一半给出，是有损压缩的量子版本。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>纠缠辅助压缩利用预共享纠缠降低压缩量子比特数，速率由互信息的一半给出，是有损压缩的量子版本。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R\\ \\ge\\ \\frac12 I(A:B)\\ \\text{（纠缠辅助）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>发送方对 A 做测量并把结果编码，接收方用 B 的纠缠辅助恢复；速率由 A、B 的关联决定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分布式量子信息处理与量子网络中的态传输。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>有损压缩允许保真度略低于 1，换取更低速率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Horodecki 等、Devetak 等研究纠缠辅助压缩。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该结果与量子信道容量的纠缠辅助版本相呼应。</p></section></div>`}]},{name:'7.2 经典信息与信道编码',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c7s2-1',name:'经典-量子信道',tags:["def", "thm", "der", "app", "note"],brief:'经典-量子信道把经典比特编码为量子态、经噪声信道传输后测量，是量子通信的基本场景。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>经典-量子信道把经典比特编码为量子态、经噪声信道传输后测量，是量子通信的基本场景。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{经典输入}\\to\\text{量子信道}\\to\\text{经典输出}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>编码为态系综 {p_i,ρ_i}，信道作用后测量得条件概率，容量由 Holevo 量给出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>光纤 QKD、量子增强传感与经典数据量子编码。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子编码可超越经典编码的容量极限（如超加性）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Holevo 1973、Schumacher-Westmoreland 1997。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>存在信道的经典容量超加性现象，即 C(χ) > χ 的单次值。</p></section></div>`},{id:'quantum_information-c7s2-2',name:'HSW 定理',tags:["def", "thm", "der", "app", "note"],brief:'HSW 定理证明经典-量子信道的容量由 Holevo 量的正则化给出，是量子 Shannon 理论的基石。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>HSW 定理证明经典-量子信道的容量由 Holevo 量的正则化给出，是量子 Shannon 理论的基石。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C=\\lim_{n\\to\\infty}\\frac1n\\max\\chi$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用典型序列与随机编码构造可达性；逆定理用 Holevo 界界定任何编码的信息量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>为量子通信系统提供理论性能上限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正则化使一般信道容量难以计算。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Holevo 1998、Schumacher-Westmoreland 1997 独立证明。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对退极化信道，经典容量随噪声增加而下降。</p></section></div>`},{id:'quantum_information-c7s2-3',name:'量子信道编码定理',tags:["def", "thm", "der", "app", "note"],brief:'量子信道编码定理把量子容量与相干信息联系起来，保证量子信息可可靠传输。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子信道编码定理把量子容量与相干信息联系起来，保证量子信息可可靠传输。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Q(\\mathcal{E})\\ \\text{由相干信息正则化给出}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>编码用随机子空间与纠缠纯化，解码用集体测量；可达性由量子典型性与纠缠保真度证明。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子中继与量子网络的速率设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子容量可为零而经典容量为正，说明量子与经典通信能力不同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Lloyd 1997、Shor 2002、Devetak 2005。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>退化信道的量子容量有单字母公式。</p></section></div>`},{id:'quantum_information-c7s2-4',name:'私密经典容量',tags:["def", "thm", "der", "app", "note"],brief:'私密经典容量是信道可生成安全密钥的速率，与量子容量和相干信息密切相关，是 QKD 的理论基础。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>私密经典容量是信道可生成安全密钥的速率，与量子容量和相干信息密切相关，是 QKD 的理论基础。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(\\mathcal{E})=\\lim\\frac1n\\max\\big(I_c(\\rho)-I_c(\\rho,\\mathcal{E})\\big)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由私密信息与相干信息的关系，结合隐私放大与纠缠纯化得到；对退化信道有单字母公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定 QKD 系统的密钥生成率上限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>私密容量与量子容量在退化信道上相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Devetak 2005 建立私密容量定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>诱骗态 QKD 的实际密钥率受私密容量约束。</p></section></div>`}]},{name:'7.3 纠缠辅助通信',color:'#0f766e',desc:'',items:[{id:'quantum_information-c7s3-1',name:'纠缠辅助容量',tags:["def", "thm", "der", "app", "note"],brief:'预共享纠缠可提升经典通信容量，纠缠辅助容量由最大化输入输出互信息给出，且具有单字母公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>预共享纠缠可提升经典通信容量，纠缠辅助容量由最大化输入输出互信息给出，且具有单字母公式。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_E(\\mathcal{E})=\\max_\\rho I(A:B)_{\\sigma}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>发送方与接收方共享纠缠，编码可用量子态隐形传态式技巧，容量由互信息上界且可达。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子网络中的高容量通信与分布式计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>纠缠辅助容量一般大于无辅助容量，且计算简单。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 等 1999、Bennett 等 2002 建立纠缠辅助容量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该容量与量子容量、私密容量共同构成量子 Shannon 理论。</p></section></div>`},{id:'quantum_information-c7s3-2',name:'超密编码与容量',tags:["def", "thm", "der", "app", "note"],brief:'超密编码是纠缠辅助通信的最简例子：1 个纠缠比特加 1 个量子比特可传 2 个经典比特。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>超密编码是纠缠辅助通信的最简例子：1 个纠缠比特加 1 个量子比特可传 2 个经典比特。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$1\\ \\text{ebit}+1\\ \\text{qubit}\\ \\to\\ 2\\ \\text{bits}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>四个 Pauli 操作编码 2 比特，接收方 Bell 测量解码，容量达到 Holevo 界。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子网络中的高效经典信息传输。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需预先共享纠缠，且纠缠本身需消耗资源建立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Bennett 与 Wiesner 1992 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>超密编码是纠缠辅助容量的可达方案之一。</p></section></div>`},{id:'quantum_information-c7s3-3',name:'量子中继的容量分析',tags:["def", "thm", "der", "app", "note"],brief:'量子中继的端到端密钥率受每段纠缠分发速率、存储时间与交换成功率限制，需整体优化。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子中继的端到端密钥率受每段纠缠分发速率、存储时间与交换成功率限制，需整体优化。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R\\ \\sim\\ \\frac{1}{\\text{段数}}\\cdot\\text{每段密钥率}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把长链路分成 N 段，每段建立纠缠的概率为 p，交换成功需两侧同时就绪；总速率随段数下降。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>设计量子网络的拓扑与资源分配。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>存储时间与分发时间的比值决定可行段数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Briegel 等 1998 年给出中继速率分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多路复用与并行交换可提高吞吐。</p></section></div>`},{id:'quantum_information-c7s3-4',name:'分布式量子计算',tags:["def", "thm", "der", "app", "note"],brief:'分布式量子计算通过网络中的纠缠与经典通信实现跨节点的量子门，是量子互联网的高阶应用。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分布式量子计算通过网络中的纠缠与经典通信实现跨节点的量子门，是量子互联网的高阶应用。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{远程 CNOT 需 }1\\ \\text{ebit}+2\\ \\text{bits}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用门隐形传态实现远程两比特门，消耗纠缠与经典信息；模块化架构可突破单芯片规模限制。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构建大规模容错量子计算机的模块化路线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>远程门的保真度受纠缠质量与通信延迟限制。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Gottesman 与 Chuang 1999 年提出分布式量子计算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>模块化架构与量子网络协议栈结合是发展方向。</p></section></div>`}]}]},
{id:'quantum_information-ch8',num:'第8章',title:'量子计量与前沿',en:'METROLOGY & FRONTIERS',sub:'Fisher 信息 · 海森堡极限 · 热力学',desc:'',sections:[{name:'8.1 量子计量',color:'#2563eb',desc:'',items:[{id:'quantum_information-c8s1-1',name:'量子 Fisher 信息',tags:["def", "thm", "der", "app", "note"],brief:'量子 Fisher 信息量化参数 θ 在量子态族 ρ_θ 中的可估计精度，是量子计量的核心量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子 Fisher 信息量化参数 θ 在量子态族 ρ_θ 中的可估计精度，是量子计量的核心量。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$F_Q[\\rho_\\theta]=\\mathrm{tr}\\big(\\rho_\\theta L_\\theta^2\\big),\\quad L_\\theta\\ \\text{为对称对数导数}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对称对数导数 L_θ 定义，满足 ∂_θρ=(L_θρ+ρL_θ)/2；对纯态 F_Q=4(⟨∂_θψ|∂_θψ⟩−|⟨ψ|∂_θψ⟩|²)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>界定相位估计、磁场测量与引力波探测的精度极限。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>F_Q 是经典 Fisher 信息在所有测量下的最大值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Braunstein 与 Caves 1994 年引入量子 Fisher 信息。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>F_Q 与 Bures 距离、量子速度极限密切相关。</p></section></div>`},{id:'quantum_information-c8s1-2',name:'Cramér-Rao 界',tags:["def", "thm", "der", "app", "note"],brief:'参数估计的均方误差下界由 Fisher 信息给出，量子版本用 F_Q 给出所有测量策略的终极极限。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>参数估计的均方误差下界由 Fisher 信息给出，量子版本用 F_Q 给出所有测量策略的终极极限。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\delta\\theta\\ \\ge\\ \\frac{1}{\\sqrt{\\nu F_Q}},\\quad \\delta\\theta\\ \\ge\\ \\frac{1}{\\sqrt{\\nu F}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由无偏估计的方差与 Fisher 信息的不等式得到；多次独立测量 ν 次可把误差降低 √ν 倍。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>设计最优测量方案，评估实验精度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>达到量子 Cramér-Rao 界需最优测量与无偏估计。</p></section><section class="la-kp-
