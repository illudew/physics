sec la-kp-his"><h5>背 景</h5><p>Cramér 1946、Rao 1945；量子版本由 Braunstein-Caves 给出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>自适应测量可逼近量子极限。</p></section></div>`},{id:'quantum_information-c8s1-3',name:'标准量子极限与海森堡极限',tags:["def", "thm", "der", "app", "note"],brief:'使用 N 个独立粒子时精度按 1/√N 提升（标准量子极限），使用纠缠或压缩态可达 1/N（海森堡极限）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>使用 N 个独立粒子时精度按 1/√N 提升（标准量子极限），使用纠缠或压缩态可达 1/N（海森堡极限）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\delta\\theta_{\\text{SQL}}\\sim\\frac{1}{\\sqrt N},\\quad \\delta\\theta_{\\text{HL}}\\sim\\frac{1}{N}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>独立粒子对应散粒噪声，F_Q∝N；纠缠态（如 GHZ）的 F_Q∝N²，故精度提升到 1/N。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>原子钟、引力波探测、磁力计与量子成像。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>海森堡极限对退相干极敏感，实际难达到。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Giovannetti、Lloyd、Maccone 2004 年系统阐述。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>压缩态可突破 SQL 而不需多体纠缠，已在 LIGO 应用。</p></section></div>`},{id:'quantum_information-c8s1-4',name:'压缩态与量子增强',tags:["def", "thm", "der", "app", "note"],brief:'压缩态在一个正交分量上低于真空涨落，以另一分量增大为代价，可用于突破标准量子极限。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>压缩态在一个正交分量上低于真空涨落，以另一分量增大为代价，可用于突破标准量子极限。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta^2X_1&lt;1,\\quad \\Delta^2X_2>1,\\quad \\Delta X_1\\Delta X_2\\ge\\frac14$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由不确定性关系，两正交分量方差乘积有下界；压缩使噪声在测量方向上减小。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>引力波探测、量子光刻与精密测量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>压缩度受损耗限制，实际约 10 dB 量级。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Caves 1981 年提出用压缩态降低干涉仪噪声。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>LIGO 已常规使用压缩光提升灵敏度。</p></section></div>`}]},{name:'8.2 量子热力学',color:'#7c3aed',desc:'',items:[{id:'quantum_information-c8s2-1',name:'Landauer 原理',tags:["def", "thm", "der", "app", "note"],brief:'擦除一个经典比特至少耗散 k_BT ln2 的能量，把信息与热力学联系起来，是计算能耗的基本极限。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>擦除一个经典比特至少耗散 k_BT ln2 的能量，把信息与热力学联系起来，是计算能耗的基本极限。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$W\\ \\ge\\ k_BT\\ln2\\ \\text{（擦除 1 比特）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由热力学第二定律与信息熵的关系推出；可逆计算可绕过该极限，但需保留全部中间信息。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>理解计算能耗、设计低功耗器件与量子热机。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>该极限是下界，实际器件远高于此。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Landauer 1961 年提出；2012 年实验验证。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Landauer 原理是信息物理化的标志性结果。</p></section></div>`},{id:'quantum_information-c8s2-2',name:'麦克斯韦妖与信息',tags:["def", "thm", "der", "app", "note"],brief:'麦克斯韦妖利用信息从单一热源提取功，其能力受所获信息量 I 的限制，信息本身是有物理代价的资源。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>麦克斯韦妖利用信息从单一热源提取功，其能力受所获信息量 I 的限制，信息本身是有物理代价的资源。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$W_{\\text{ext}}\\le k_BT\\,I$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>妖通过测量获得比特信息，擦除存储器时耗散能量，恰好抵消提取的功，第二定律不被违反。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>量子热机、信息驱动的量子器件与量子测量热力学。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子相干与纠缠可作为热力学资源，提升热机效率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Szilard 1929 年提出单粒子热机；Landauer 与 Bennett 解决妖悖论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子版本的妖利用量子关联可超越经典极限。</p></section></div>`},{id:'quantum_information-c8s2-3',name:'量子热机与相干资源',tags:["def", "thm", "der", "app", "note"],brief:'量子热机以量子系统为工作物质，其效率受卡诺界约束，但量子相干与纠缠可提升功率或实现超越经典的热力学任务。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子热机以量子系统为工作物质，其效率受卡诺界约束，但量子相干与纠缠可提升功率或实现超越经典的热力学任务。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\eta\\le 1-\\frac{T_c}{T_h}\\ \\text{（卡诺）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用两能级或多能级系统与热库耦合，循环做功；量子相干可在相同条件下提高输出功率。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>微型热机、量子电池与量子制冷。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子优势在效率上不违反卡诺界，主要体现在功率与稳定性。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Scovil 与 Schulz-DuBois 1959 年提出量子热机思想。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子热力学是近年快速发展的交叉领域。</p></section></div>`},{id:'quantum_information-c8s2-4',name:'量子电池',tags:["def", "thm", "der", "app", "note"],brief:'量子电池利用量子态存储能量，纠缠可使其最大可提取功按 N² 增长，超越独立单元的线性标度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子电池利用量子态存储能量，纠缠可使其最大可提取功按 N² 增长，超越独立单元的线性标度。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E_{\\max}\\ \\sim\\ N^2\\ \\text{（纠缠增强）}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把 N 个二能级单元制备为纠缠态，集体充电使能量与 N² 成正比；但充放电功率与稳定性需权衡。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>高效储能与量子能量传输。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>纠缠态的脆弱性使实际增益难以维持。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Alicki 与 Fannes 2013 年提出量子电池概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子电池的「超吸收」与「超提取」是研究热点。</p></section></div>`}]},{name:'8.3 前沿方向',color:'#0f766e',desc:'',items:[{id:'quantum_information-c8s3-1',name:'量子存储与量子中继',tags:["def", "thm", "der", "app", "note"],brief:'量子存储是量子网络的核心器件，需同时满足长存储时间、高效率与高保真度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子存储是量子网络的核心器件，需同时满足长存储时间、高效率与高保真度。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{存储时间}\\times\\text{效率}\\ \\text{决定中继可行性}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>原子系综、稀土晶体与腔 QED 是主要平台；指标为存储时间、效率、多模能力与保真度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>同步分布式纠缠、构建量子互联网。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>存储时间与效率常相互制约，需针对应用优化。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Cirac 等 1997 年提出量子存储器与网络结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多模存储可并行处理多路纠缠，提高吞吐。</p></section></div>`},{id:'quantum_information-c8s3-2',name:'测量型量子计算',tags:["def", "thm", "der", "app", "note"],brief:'测量型量子计算（MBQC）先制备大簇态，再通过自适应单比特测量实现计算，测量顺序与基决定算法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>测量型量子计算（MBQC）先制备大簇态，再通过自适应单比特测量实现计算，测量顺序与基决定算法。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{簇态}+\\text{单比特测量}\\ \\Rightarrow\\ \\text{通用计算}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>簇态是图态的稳定子态，测量会消耗纠缠并把信息传递；通过前馈补偿实现确定性门。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>光量子计算的主流路线，避免两比特门的概率性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需大量量子比特与低延迟前馈。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Raussendorf 与 Briegel 2001 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>MBQC 与线路模型等价，可相互编译。</p></section></div>`},{id:'quantum_information-c8s3-3',name:'量子机器学习',tags:["def", "thm", "der", "app", "note"],brief:'量子机器学习用量子线路处理高维特征空间，潜在优势在于核方法与线性代数加速，但对数据读取与输出有严格限制。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子机器学习用量子线路处理高维特征空间，潜在优势在于核方法与线性代数加速，但对数据读取与输出有严格限制。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{量子核方法、量子神经网络}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把数据编码为量子态（振幅编码、角度编码），用量子线路计算核或梯度，经典优化器更新参数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分类、生成模型与量子化学辅助。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>数据加载与读出成本常抵消理论加速，需谨慎评估。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Lloyd 等 2013 年提出量子机器学习框架。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子核方法与去量子化研究是当前热点。</p></section></div>`},{id:'quantum_information-c8s3-4',name:'量子互联网',tags:["def", "thm", "der", "app", "note"],brief:'量子互联网是以纠缠为基本资源、连接量子处理器与传感器的网络，支持 QKD、分布式计算与量子传感。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子互联网是以纠缠为基本资源、连接量子处理器与传感器的网络，支持 QKD、分布式计算与量子传感。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{纠缠分发}+\\text{存储}+\\text{路由}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>分层协议：物理层分发纠缠，链路层交换与纯化，网络层路由，应用层运行协议。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构建全球量子通信与分布式量子计算基础设施。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>量子中继、存储与接口的工程成熟度是瓶颈。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>Wehner、Elkouss、Hanson 2018 年提出量子互联网愿景。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>量子网络与经典互联网将长期共存、逐步融合。</p></section></div>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
