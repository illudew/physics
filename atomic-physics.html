{id:'atomic_physics-ch6',num:'第6章',title:'X 射线',en:'X-RAYS',sub:'布拉格衍射 · 特征谱 · 康普顿散射 · 吸收',desc:'',sections:[{name:'6.1 性质与布拉格衍射',color:'#2563eb',desc:'',items:[{id:'atomic_physics-c6s1-1',name:'X 射线的性质',tags:["def", "thm", "der", "app", "note"],brief:'X 射线是伦琴 1895 年发现的波长极短的电磁波，介于紫外与 γ 射线之间，具有穿透性、使荧光物质发光、使底片感光与电…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>X 射线是伦琴 1895 年发现的波长极短的电磁波，介于紫外与 γ 射线之间，具有穿透性、使荧光物质发光、使底片感光与电离气体的能力。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lambda=0.001\\sim1\\ \\mathrm{nm}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由高速电子轰击金属靶产生；本质是电磁横波，波长比可见光短三个数量级，故能量高、穿透力强。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>医学成像、材料结构分析、安全检查与天体物理观测。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>X 射线不受电场偏转，说明不带电；可被磁场偏转的是 β 射线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>伦琴 1895 年发现，1901 年首届诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同步辐射光源可产生高亮度、可调波长的 X 射线。</p></section></div>`},{id:'atomic_physics-c6s1-2',name:'布拉格衍射公式',tags:["def", "thm", "der", "app", "note"],brief:'X 射线在晶体中发生衍射，相邻晶面散射光的光程差为 $2d\\sin\\theta$，当它等于波长的整数倍时干涉加强，形成衍…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>X 射线在晶体中发生衍射，相邻晶面散射光的光程差为 $2d\\sin\\theta$，当它等于波长的整数倍时干涉加强，形成衍射峰。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$2d\\sin\\theta=n\\lambda,\\quad n=1,2,\\cdots$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>入射与反射光线在相邻晶面上的光程差为 $2d\\sin\\theta$（$d$ 为晶面间距，$\\theta$ 为掠射角）；相长干涉条件即 $2d\\sin\\theta=n\\lambda$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>测定晶体结构、晶格常数与 X 射线波长，是晶体学的基石。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\theta$ 是掠射角（与晶面夹角），不是与法线的夹角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>布拉格父子 1913 年提出并用于测定晶体结构，1915 年获诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代粉末衍射（XRD）用该公式标定物相与晶格参数。</p></section></div>`},{id:'atomic_physics-c6s1-3',name:'X 射线衍射的应用',tags:["def", "thm", "der", "app", "note"],brief:'由测得的衍射角与已知波长求晶面间距，进而确定晶体结构与晶格常数；反之由已知晶体测定未知波长。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由测得的衍射角与已知波长求晶面间距，进而确定晶体结构与晶格常数；反之由已知晶体测定未知波长。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$d=\\frac{n\\lambda}{2\\sin\\theta}\\ \\Rightarrow\\ \\text{晶格常数}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对不同晶面（$hkl$）测得一系列 $\\theta$，由 $d_{hkl}$ 与晶格常数的几何关系解出晶胞参数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>材料科学、蛋白质结构解析、药物设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>单晶衍射给出原子级三维结构，粉末衍射用于物相鉴定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>劳厄 1912 年先发现晶体 X 射线衍射，布拉格父子随后给出解释。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>DNA 双螺旋结构即由 X 射线衍射照片（富兰克林）推断。</p></section></div>`}]},{name:'6.2 X 射线的产生',color:'#7c3aed',desc:'',items:[{id:'atomic_physics-c6s2-1',name:'连续谱与量子极限',tags:["def", "thm", "der", "app", "note"],brief:'高速电子打在靶上产生连续 X 射线谱，其短波极限 $\\lambda_{\\min}$ 只与加速电压 $V$ 有关，与靶材无…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>高速电子打在靶上产生连续 X 射线谱，其短波极限 $\\lambda_{\\min}$ 只与加速电压 $V$ 有关，与靶材无关。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lambda_{\\min}=\\frac{1.24}{V}\\ \\mathrm{nm},\\quad h\\nu_{\\max}=\\frac{hc}{\\lambda_{\\min}}=eV$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>电子把全部动能转化为一个光子时频率最高：$eV=h\\nu_{\\max}=hc/\\lambda_{\\min}$，代入常数得 $\\lambda_{\\min}(\\mathrm{nm})=1.24/V(\\mathrm{kV})$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>测定普朗克常数、校准 X 射线管电压与谱仪。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>连续谱由韧致辐射（电子在核场中减速）产生，是电子动能连续转化的结果。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该极限由量子假说直接给出，是早期验证量子论的重要证据。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代 X 射线管用钨靶、数十 kV 电压，$\\lambda_{\\min}$ 约 0.01–0.1 nm。</p></section></div>`},{id:'atomic_physics-c6s2-2',name:'特征谱与莫塞莱定律',tags:["def", "thm", "der", "app", "note"],brief:'当管电压足够高时，连续谱上叠加分立的特征谱线，其波长只由靶材决定，源于内层电子被击出后的跃迁。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当管电压足够高时，连续谱上叠加分立的特征谱线，其波长只由靶材决定，源于内层电子被击出后的跃迁。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E_{K\\alpha}=\\frac34\\times13.6(Z-1)^2\\ \\mathrm{eV}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>入射电子击出 K 层电子，外层电子跃迁填补空位，发出 K 系辐射。用类氢公式并考虑剩余电子对核电荷的屏蔽（$Z-1$），得 $E_{K\\alpha}=\\frac34\\times13.6(Z-1)^2$；莫塞莱进一步发现 $\\sqrt{\\nu}\\propto(Z-1)$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定靶材元素、分析材料成分（X 射线荧光光谱 XRF）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>特征谱波长与靶材一一对应，是元素的「指纹」。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>莫塞莱 1913 年发现该规律，为元素周期表提供原子序数的物理依据。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>K 系、L 系、M 系分别对应跃迁到 $n=1,2,3$ 的终态。</p></section></div>`},{id:'atomic_physics-c6s2-3',name:'X 射线管与产生机制',tags:["def", "thm", "der", "app", "note"],brief:'X 射线管由阴极（钨丝）、阳极（金属靶）与高真空管壳组成；阴极发射电子，经数万伏高压加速后轰击靶面，产生连续谱与特征谱。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>X 射线管由阴极（钨丝）、阳极（金属靶）与高真空管壳组成；阴极发射电子，经数万伏高压加速后轰击靶面，产生连续谱与特征谱。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{热电子}\\ \\to\\ \\text{高压加速}\\ \\to\\ \\text{靶}\\ \\to\\ \\text{X 射线}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>电子动能 $eV$ 转化为 X 射线光子与热；只有约 1% 转化为 X 射线，其余变为热，故阳极需水冷。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>医学诊断、工业探伤与科研光源。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>提高电压可增强穿透力（短波成分增加），提高电流可增加强度。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>库利吉 1913 年发明热阴极 X 射线管。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>旋转阳极与同步辐射光源大幅提高了功率与亮度。</p></section></div>`},{id:'atomic_physics-c6s2-4',name:'X 射线的偏振与相干性',tags:["def", "thm", "der", "app", "note"],brief:'X 射线是横波，其电场振动方向垂直于传播方向；在特定几何下可观察到偏振，说明其电磁波本质。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>X 射线是横波，其电场振动方向垂直于传播方向；在特定几何下可观察到偏振，说明其电磁波本质。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{韧致辐射}\\ \\perp\\ \\text{电子运动方向}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由麦克斯韦电磁理论，加速电荷辐射的电磁波是横波；韧致辐射的偏振度与观测角有关。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>验证 X 射线的波动性，用于晶体偏振分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>偏振实验（巴克拉 1906）是 X 射线为电磁波的重要证据。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>巴克拉因发现元素的特征 X 射线获 1917 年诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同步辐射的偏振特性使其成为研究磁结构的工具。</p></section></div>`}]},{name:'6.3 康普顿散射',color:'#0f766e',desc:'',items:[{id:'atomic_physics-c6s3-1',name:'康普顿效应',tags:["def", "thm", "der", "app", "note"],brief:'X 射线被自由电子散射后波长变长，且波长改变量只与散射角有关、与入射波长和材料无关。这证明光子具有动量，光与电子的相互作…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>X 射线被自由电子散射后波长变长，且波长改变量只与散射角有关、与入射波长和材料无关。这证明光子具有动量，光与电子的相互作用是弹性碰撞。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta\\lambda=\\lambda′-\\lambda=\\frac{h}{m_0c}(1-\\cos\\theta)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>能量守恒 $h\\nu+E_0=h\\nu′+E$，动量守恒 $\\vec p_\\gamma=\\vec p_\\gamma′+\\vec p_e$；用相对论能量-动量关系消去电子量，解得 $\\Delta\\lambda=\\frac{h}{m_ec}(1-\\cos\\theta)$，其中 $h/(m_ec)=2.43\\times10^{-12}\\,\\mathrm{m}$ 为康普顿波长。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明光的粒子性（波动理论无法解释波长改变），是量子力学的重要实验基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>散射角越大波长改变越大；$\\theta=180^\\circ$ 时改变最大，$\\theta=0$ 时无改变。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>康普顿 1923 年发现，1927 年获诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>康普顿散射是 γ 射线与物质相互作用的主要机制之一（另两种为光电效应与电子对产生）。</p></section></div>`},{id:'atomic_physics-c6s3-2',name:'康普顿散射的能量关系',tags:["def", "thm", "der", "app", "note"],brief:'散射光子的能量随散射角增大而减小，反冲电子获得剩余能量；$\\gamma$ 为入射光子能量与电子静能之比。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>散射光子的能量随散射角增大而减小，反冲电子获得剩余能量；$\\gamma$ 为入射光子能量与电子静能之比。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$h\\nu′=\\frac{h\\nu}{1+\\gamma(1-\\cos\\theta)},\\quad \\gamma=\\frac{h\\nu}{m_0c^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\Delta\\lambda$ 关系与 $\\nu=c/\\lambda$ 直接变换得到；当 $\\gamma\\ll1$（低能）时 $\\Delta\\lambda$ 相对很小，趋于经典散射。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算散射光子与反冲电子的能量分配，用于辐射防护与探测器设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\theta=\\pi$ 时散射光子能量最小、反冲电子动能最大（康普顿边缘）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该能量关系由康普顿 1923 年给出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>康普顿边缘是 γ 能谱分析中的特征量。</p></section></div>`},{id:'atomic_physics-c6s3-3',name:'反冲电子与康普顿波长',tags:["def", "thm", "der", "app", "note"],brief:'康普顿波长是电子对应的特征长度，表示 $\\Delta\\lambda$ 的量级；反冲电子获得入射光子的一部分能量，其动能随…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>康普顿波长是电子对应的特征长度，表示 $\\Delta\\lambda$ 的量级；反冲电子获得入射光子的一部分能量，其动能随散射角变化。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lambda_C=\\frac{h}{m_ec}=2.43\\times10^{-12}\\ \\mathrm{m}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\Delta\\lambda=\\lambda_C(1-\\cos\\theta)$；反冲电子动能 $E_k=h\\nu-h\\nu′$，在 $\\theta=\\pi$ 时最大。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释康普顿散射中的电子反冲信号，用于电子探测与剂量计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\lambda_C$ 与电子的康普顿波长同名，但注意它不等于德布罗意波长。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>康普顿波长是量子场论中的基本长度尺度之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>$\\lambda_C$ 与精细结构常数、玻尔半径通过 $\\alpha$ 相联系。</p></section></div>`}]},{name:'6.4 X 射线的吸收',color:'#c2410c',desc:'',items:[{id:'atomic_physics-c6s4-1',name:'朗伯-比尔定律',tags:["def", "thm", "der", "app", "note"],brief:'X 射线穿过物质时强度按指数衰减，$\\mu$ 为线性吸收系数，其倒数为吸收长度（强度衰减到 $1/e$ 的厚度）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>X 射线穿过物质时强度按指数衰减，$\\mu$ 为线性吸收系数，其倒数为吸收长度（强度衰减到 $1/e$ 的厚度）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$I=I_0e^{-\\mu x},\\quad x=\\frac{1}{\\mu}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由逐层吸收的微分方程 $dI=-\\mu I\\,dx$ 积分得；$\\mu$ 与材料密度、原子序数和光子能量有关，$\\mu\\propto Z^3\\lambda^3$（光电吸收主导时）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>医学影像的对比度、辐射防护的屏蔽厚度计算、材料厚度测量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>重元素（如铅）与低能 X 射线吸收强，故用铅屏蔽、用低能 X 射线提高软组织对比。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>朗伯 1760 年、比尔 1852 年分别提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>吸收系数在元素吸收边处发生突变，是 X 射线吸收谱（XAS）的基础。</p></section></div>`},{id:'atomic_physics-c6s4-2',name:'吸收边与吸收谱',tags:["def", "thm", "der", "app", "note"],brief:'当光子能量恰好等于内层电子的结合能时，该壳层电子可被激发到连续态，吸收系数突然增大，形成吸收边（K 边、L 边等）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当光子能量恰好等于内层电子的结合能时，该壳层电子可被激发到连续态，吸收系数突然增大，形成吸收边（K 边、L 边等）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mu(E)\\ \\text{在}\\ E=E_{\\text{edge}}\\ \\text{处突变}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>吸收边能量等于对应壳层的结合能；边以上的振荡结构（EXAFS/XANES）反映邻近原子的配位环境。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>X 射线吸收谱用于分析元素的化学价态与局域结构，是材料科学的常用手段。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>吸收边位置随元素种类而变，是元素识别的依据。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>吸收谱技术（XANES/EXAFS）在 1970 年代随同步辐射发展成熟。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>吸收边两侧的精细结构可用于测定键长与配位数。</p></section></div>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
