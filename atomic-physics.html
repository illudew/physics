const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', note:'注 记', his:'背 景', ext:'拓 展'};
const LA_DATA = [
{id:'atomic_physics-ch1',num:'第1章',title:'卢瑟福模型',en:'RUTHERFORD MODEL',sub:'原子结构 · 库仑散射 · 散射截面',desc:'',sections:[{name:'1.1 原子与基本常数',color:'#2563eb',desc:'',items:[{id:'atomic_physics-c1s1-1',name:'原子的概念与尺度',tags:["def", "thm", "der", "app", "note"],brief:'原子是元素保持化学性质的最小粒子，由带正电的原子核与核外电子组成。原子半径约 $10^{-10}\\,\\mathrm{m}…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>原子是元素保持化学性质的最小粒子，由带正电的原子核与核外电子组成。原子半径约 $10^{-10}\\,\\mathrm{m}$（1 Å），核半径约 $10^{-15}\\,\\mathrm{m}$（1 fm），两者相差约五个数量级。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r_{\\mathrm{atom}}\\sim10^{-10}\\ \\mathrm{m},\\quad r_{\\mathrm{nucleus}}\\sim10^{-15}\\ \\mathrm{m}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由阿伏伽德罗常数与摩尔体积可估原子半径：设固体中原子紧密堆积，每个原子占体积 $V_m/N_A$，则 $r\\approx\\left(\\frac{3V_m}{4\\pi N_A}\\right)^{1/3}$。核半径则由散射实验测定，满足 $r\\approx1.2A^{1/3}\\,\\mathrm{fm}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>原子半径决定化学键长与晶体结构，核半径决定核反应与结合能。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>原子内部几乎全空：核只占原子体积的 $10^{-15}$ 量级，却集中了 99.9% 以上的质量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>原子论由道尔顿 1803 年提出；原子核由卢瑟福 1911 年通过 α 散射发现。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>原子的电子云半径与核半径之比，常被比作「体育场中央的一粒沙子」。</p></section></div>`},{id:'atomic_physics-c1s1-2',name:'物质的量与阿伏伽德罗常数',tags:["def", "thm", "der", "app", "note"],brief:'物质的量 $n$ 以摩尔为单位，1 mol 任何物质都含 $N_A$ 个基本单元。它是连接微观粒子数与宏观质量的桥梁。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>物质的量 $n$ 以摩尔为单位，1 mol 任何物质都含 $N_A$ 个基本单元。它是连接微观粒子数与宏观质量的桥梁。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$N_A=6.02\\times10^{23}\\ \\mathrm{mol^{-1}},\\quad n=\\frac{N}{N_A}=\\frac{m}{M}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $1\\,\\mathrm{mol}$ 碳-12 的质量为 $12\\,\\mathrm{g}$、单个原子质量为 $12u$，得 $N_A=1\\,\\mathrm{g}/u=6.02\\times10^{23}$。现代定义固定 $N_A$ 的数值，反过来定义摩尔。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算样品中的原子数、放射性活度、气体分子数密度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>2019 年国际单位制改革后，$N_A$ 成为定义值而非测量值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>阿伏伽德罗 1811 年提出分子假说，1909 年佩兰由布朗运动测定其数值。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>法拉第常数 $F=eN_A=9.65\\times10^{4}\\,\\mathrm{C/mol}$，把电化学与元电荷联系起来。</p></section></div>`},{id:'atomic_physics-c1s1-3',name:'元电荷与密立根油滴实验',tags:["def", "thm", "der", "app", "note"],brief:'电子电荷是自然界最小的自由电荷，1913 年密立根用油滴实验证明电荷是量子化的，并测出其精确值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电子电荷是自然界最小的自由电荷，1913 年密立根用油滴实验证明电荷是量子化的，并测出其精确值。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$e=1.602\\times10^{-19}\\ \\mathrm{C}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>带电油滴在重力、浮力、电场力与黏滞阻力下达到匀速：$qE=mg$（无电场时由终端速度定半径）。改变电量后重复测量，发现 $q$ 总是 $e$ 的整数倍，从而得 $e$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定元电荷，是原子物理与电化学所有定量计算的基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>夸克带 $\\pm e/3$、$\\pm2e/3$，但不能单独存在，故自由电荷仍以 $e$ 为最小单位。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>密立根 1909–1913 年完成实验，获 1923 年诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代值由约瑟夫森效应与量子霍尔效应给出，不确定度已进入 $10^{-10}$ 量级。</p></section></div>`},{id:'atomic_physics-c1s1-4',name:'原子质量单位与能量单位',tags:["def", "thm", "der", "app", "note"],brief:'原子质量单位 $u$ 定义为碳-12 原子质量的 $1/12$。电子 $0.511\\,\\mathrm{MeV}/c^2$…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>原子质量单位 $u$ 定义为碳-12 原子质量的 $1/12$。电子 $0.511\\,\\mathrm{MeV}/c^2$、质子 $938.27\\,\\mathrm{MeV}/c^2$、中子 $939.57\\,\\mathrm{MeV}/c^2$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$1u=\\frac{1}{N_A}\\,\\mathrm{g}=1.6605\\times10^{-27}\\ \\mathrm{kg},\\quad 1\\,\\mathrm{eV}=1.602\\times10^{-19}\\ \\mathrm{J}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由质能关系 $E=mc^2$，质量可直接用能量单位表示：$m(\\mathrm{MeV}/c^2)=m(u)\\times931.5$。原子物理中能级差约 eV 量级，核物理约 MeV 量级。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一原子物理、核物理与粒子物理中的质量与能量换算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$1u$ 对应的能量 $931.5\\,\\mathrm{MeV}$ 称为原子质量单位能量当量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>爱因斯坦 1905 年给出 $E=mc^2$；原子质量单位 1961 年统一为碳-12 基准。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>光谱学常用波数 $\\tilde\\nu=1/\\lambda$（$\\mathrm{cm^{-1}}$），$1\\,\\mathrm{eV}\\leftrightarrow8065.5\\,\\mathrm{cm^{-1}}$。</p></section></div>`}]},{name:'1.2 核式结构模型',color:'#7c3aed',desc:'',items:[{id:'atomic_physics-c1s2-1',name:'汤姆孙模型及其困难',tags:["def", "thm", "der", "app", "note"],brief:'汤姆孙 1904 年提出「葡萄干布丁」模型：正电荷均匀分布在半径约 $10^{-10}\\,\\mathrm{m}$ 的球内…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>汤姆孙 1904 年提出「葡萄干布丁」模型：正电荷均匀分布在半径约 $10^{-10}\\,\\mathrm{m}$ 的球内，电子嵌在其中。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho(r)\\ \\text{均匀分布},\\quad r\\le R$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>该模型可解释原子的电中性，但正电荷分散导致内部电场很弱。按此模型估算，α 粒子穿过原子时最大偏转角仅约 $10^{-4}$ rad，无法解释大角度散射。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>作为卢瑟福模型的对照，说明「大角度散射」是判别原子内部电荷分布的关键实验。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>汤姆孙模型对散射截面的预言与实验在小角度符合，在大角度严重偏低。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>汤姆孙 1904 年提出，因发现电子获 1906 年诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该模型后来被 α 散射实验否定，但「原子可再分」的思想被保留。</p></section></div>`},{id:'atomic_physics-c1s2-2',name:'α 粒子散射实验',tags:["def", "thm", "der", "app", "note"],brief:'卢瑟福让准直的 α 粒子束轰击金箔，用荧光屏统计不同散射角的粒子数。结果发现约 $1/8000$ 的 α 粒子偏转超过 …',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>卢瑟福让准直的 α 粒子束轰击金箔，用荧光屏统计不同散射角的粒子数。结果发现约 $1/8000$ 的 α 粒子偏转超过 $90^\\circ$，甚至被反弹回来。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\alpha={}^{4}_{2}\\mathrm{He}^{2+},\\quad E\\sim5\\ \\mathrm{MeV}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设靶原子正电荷均匀分布，则库仑力有限，无法使 5 MeV 的 α 粒子大角度偏转；只有把正电荷集中在极小区域，才能提供足够强的电场。由此反推核的存在。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>这是人类第一次探测原子内部结构，确立核式模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>大角度散射截面比汤姆孙模型预言大约 $10^{4}$ 倍，是核式结构最直接的证据。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>盖革与马斯登 1909 年按卢瑟福建议完成实验。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代版本用卢瑟福背散射谱（RBS）分析材料表面成分与厚度。</p></section></div>`},{id:'atomic_physics-c1s2-3',name:'卢瑟福核式模型',tags:["def", "thm", "der", "app", "note"],brief:'原子全部正电荷与几乎全部质量集中在半径约 $10^{-15}\\,\\mathrm{m}$ 的原子核内，电子在核外绕行；原子…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>原子全部正电荷与几乎全部质量集中在半径约 $10^{-15}\\,\\mathrm{m}$ 的原子核内，电子在核外绕行；原子核由质子与中子组成。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r_{\\mathrm{nucleus}}\\approx1.2A^{1/3}\\ \\mathrm{fm}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 α 散射的最小瞄准距反推核半径上限：$r_m$ 越小，所需电场越强。实验给出 $r_m\\sim10^{-14}\\,\\mathrm{m}$，结合后续高能电子散射得经验公式 $r=1.2A^{1/3}\\,\\mathrm{fm}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>奠定量子力学之前的原子图像，为玻尔模型提供结构基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>核式模型的经典困难：绕核运动的电子应辐射能量并坠入核内，无法解释原子稳定性——这催生了玻尔模型。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>卢瑟福 1911 年发表《物质对 α、β 粒子的散射与原子结构》。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>高能电子散射（Hofstadter）进一步给出核电荷分布，发现核表面有约 0.5 fm 的模糊层。</p></section></div>`},{id:'atomic_physics-c1s2-4',name:'原子核半径的估算',tags:["def", "thm", "der", "app", "note"],brief:'当 α 粒子正对核入射（瞄准距 $b=0$）时，最近距离 $r_m$ 由动能全部转化为库仑势能决定，由此给出核半径的上限…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当 α 粒子正对核入射（瞄准距 $b=0$）时，最近距离 $r_m$ 由动能全部转化为库仑势能决定，由此给出核半径的上限。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r_m=\\frac{1}{4\\pi\\varepsilon_0}\\frac{2Ze^2}{E_\\alpha}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>取质心系（靶核近似不动），$\\frac12m v^2=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Z_1Z_2e^2}{r_m}$，解得 $r_m=\\frac{2Z_1Z_2e^2}{4\\pi\\varepsilon_0E}$。实验测得 $r_m$ 后，核半径 $R\\lesssim r_m$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定原子核的大小，是核物理的起点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>高能 α 粒子可穿透库仑势垒，此时 $r_m$ 反映核力作用范围，散射偏离卢瑟福公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该估算由卢瑟福 1911 年给出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>更精确的核半径由电子散射与 μ 子原子 X 射线谱测定。</p></section></div>`}]},{name:'1.3 库仑散射公式',color:'#0f766e',desc:'',items:[{id:'atomic_physics-c1s3-1',name:'库仑散射因子',tags:["def", "thm", "der", "app", "note"],brief:'库仑散射因子 $a$ 是具有长度量纲的特征参数，表示 α 粒子正对入射时最近距离的一半，刻画库仑斥力的强弱。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>库仑散射因子 $a$ 是具有长度量纲的特征参数，表示 α 粒子正对入射时最近距离的一半，刻画库仑斥力的强弱。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a=\\frac{2Z_1Z_2e^2}{4\\pi\\varepsilon_0E},\\quad E=\\frac12mv^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由能量守恒，正对入射的最近距离 $r_m=a$；当瞄准距 $b$ 增大时，偏转角减小，$b$ 与 $a$ 同量级时散射显著。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一描述不同能量、不同靶核的散射强弱，是散射公式的核心参数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$a$ 越小（能量越高），偏离卢瑟福公式的临界角越大。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>库仑散射公式由卢瑟福 1911 年推导。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>在质心系中应以折合质量与相对速度计算 $E$。</p></section></div>`},{id:'atomic_physics-c1s3-2',name:'瞄准距与散射角的关系',tags:["def", "thm", "der", "app", "note"],brief:'α 粒子在库仑场中沿双曲线轨道运动，瞄准距 $b$ 与散射角 $\\theta$ 之间存在一一对应的反比余切关系：$b$ …',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>α 粒子在库仑场中沿双曲线轨道运动，瞄准距 $b$ 与散射角 $\\theta$ 之间存在一一对应的反比余切关系：$b$ 越大偏转越小，$b\\to0$ 时 $\\theta\\to\\pi$（正对反弹）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$b=\\frac{a}{2}\\cot\\frac{\\theta}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>推导分三步：①库仑力 $\\vec F=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Z_1Z_2e^2}{r^2}\\hat r$ 代入牛顿方程；②角动量守恒 $mr^2\\dot\\varphi=L=mvb$；③能量守恒 $\\frac12mv^2=\\frac12m(\\dot r^2+r^2\\dot\\varphi^2)+\\frac{k}{r}$。消去时间得轨道方程 $r=\\frac{p}{1+e\\cos\\varphi}$，由无穷远处渐近线夹角得 $\\theta=\\pi-2\\varphi_0$，化简即得上式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>把不可直接测量的瞄准距换成可测量的散射角，是散射理论的标准技巧。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>双曲线轨道的偏心率 $e=1/\\sin(\\theta/2)$，半正焦弦 $p=a$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>经典力学中的卢瑟福散射推导，见卢瑟福 1911 年原文。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同一公式在量子力学中仍然成立，因为库仑势的散射恰好与经典轨迹一致（WKB 精确）。</p></section></div>`},{id:'atomic_physics-c1s3-3',name:'散射角分布与实验检验',tags:["def", "thm", "der", "app", "note"],brief:'单位时间内散射到立体角 $d\\Omega$ 的粒子数占总数的比例，与 $\\sin^4(\\theta/2)$ 成反比，这是…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>单位时间内散射到立体角 $d\\Omega$ 的粒子数占总数的比例，与 $\\sin^4(\\theta/2)$ 成反比，这是卢瑟福公式最显著的特征。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{dN}{N}=\\frac{n t}{16}\\left(\\frac{Z_1Z_2e^2}{4\\pi\\varepsilon_0E}\\right)^2\\frac{d\\Omega}{\\sin^4(\\theta/2)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对固定 $b$ 到 $b+db$ 的环带，面积 $2\\pi b\\,db$ 内的入射粒子都会散射到 $\\theta$ 到 $\\theta-d\\theta$ 的立体角内，代入 $b(\\theta)$ 求导即得该分布。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实验上验证 $\\sin^{-4}(\\theta/2)$ 依赖关系，从而确认库仑散射机制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>小角度时公式发散，因为此时多次散射与电子屏蔽变得重要。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>盖革-马斯登 1913 年定量验证该分布。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该分布是卢瑟福背散射分析（RBS）的定量基础。</p></section></div>`}]},{name:'1.4 卢瑟福散射公式与截面',color:'#c2410c',desc:'',items:[{id:'atomic_physics-c1s4-1',name:'微分散射截面',tags:["def", "thm", "der", "app", "note"],brief:'微分散射截面是单位时间散射到单位立体角的粒子数与入射通量、靶面密度之比，具有面积量纲，表征单个靶核把粒子散射到某方向的「…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>微分散射截面是单位时间散射到单位立体角的粒子数与入射通量、靶面密度之比，具有面积量纲，表征单个靶核把粒子散射到某方向的「有效面积」。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sigma(\\theta)=\\frac{d\\sigma}{d\\Omega}=\\frac{dN}{N n t\\,d\\Omega}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设靶箔单位体积有 $n$ 个原子、厚度 $t$、束流 $N$ 个粒子，则散射到 $d\\Omega$ 的粒子数 $dN=N n t\\,\\sigma(\\theta)d\\Omega$，反解即定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>截面是连接理论与实验的核心可观测量，可用来反推相互作用势与靶核性质。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>总截面 $\\sigma_{\\text{tot}}=\\int\\sigma(\\theta)d\\Omega$，库仑散射的总截面发散（长程力）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>截面概念由卢瑟福 1911 年引入核物理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代对撞机用截面（barn，$1\\,\\mathrm{b}=10^{-28}\\,\\mathrm{m^2}$）描述反应概率。</p></section></div>`},{id:'atomic_physics-c1s4-2',name:'卢瑟福散射公式',tags:["def", "thm", "der", "app", "note"],brief:'这是库仑散射的微分散射截面，又称卢瑟福公式。它与 $Z_1^2Z_2^2$ 成正比、与 $E^2$ 成反比、与 $\\si…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>这是库仑散射的微分散射截面，又称卢瑟福公式。它与 $Z_1^2Z_2^2$ 成正比、与 $E^2$ 成反比、与 $\\sin^4(\\theta/2)$ 成反比。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sigma(\\theta)=\\left(\\frac{Z_1Z_2e^2}{16\\pi\\varepsilon_0E}\\right)^2\\frac{1}{\\sin^4(\\theta/2)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $b=\\frac{a}{2}\\cot\\frac{\\theta}{2}$ 求 $db/d\\theta=-\\frac{a}{4\\sin^2(\\theta/2)}$，环面积 $2\\pi b|db|=\\frac{\\pi a^2}{4}\\frac{\\cos(\\theta/2)}{\\sin^3(\\theta/2)}d\\theta$，再除以 $d\\Omega=2\\pi\\sin\\theta\\,d\\theta=4\\pi\\sin(\\theta/2)\\cos(\\theta/2)d\\theta$，即得 $\\sigma=\\frac{a^2}{16\\sin^4(\\theta/2)}$，代入 $a$ 得本式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用于卢瑟福背散射谱、薄膜厚度与成分分析、以及检验库仑定律在小距离上的适用性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>公式只含库仑力，实验偏离处即反映核力或核电荷分布开始起作用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>卢瑟福 1911 年推导，盖革-马斯登 1913 年实验验证。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对同一靶，$\\sigma\\propto1/E^2$，故低能粒子更易大角度散射。</p></section></div>`},{id:'atomic_physics-c1s4-3',name:'实验验证与偏离',tags:["def", "thm", "der", "app", "note"],brief:'实验在较大瞄准距（小散射角、低能）时与卢瑟福公式精确符合；当能量高到使 α 粒子接近核表面（$r_m\\sim R$）时，…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>实验在较大瞄准距（小散射角、低能）时与卢瑟福公式精确符合；当能量高到使 α 粒子接近核表面（$r_m\\sim R$）时，实测截面小于公式预言，表明核力开始起作用。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sigma_{\\exp}\\ \\begin{cases}=\\sigma_{R}, & b\\gg R\\\\ &lt;\\sigma_{R}, & b\\sim R\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\sigma$ 的偏离能量反推核半径 $R$：当 $E$ 增大到 $r_m(E)\\approx R$ 时开始偏离，故 $R\\approx\\frac{2Z_1Z_2e^2}{4\\pi\\varepsilon_0E_{\\text{偏离}}}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>这是测量核半径、研究核力短程性的经典方法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>偏离还来自核电荷分布的非点性、电子屏蔽与多次散射。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>20 世纪 50 年代起用高能电子散射取代 α 散射，精度大幅提高。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代 RBS 利用偏离反演近表面元素深度分布。</p></section></div>`}]}]},
{id:'atomic_physics-ch2',num:'第2章',title:'玻尔模型',en:'BOHR MODEL',sub:'黑体辐射 · 光电效应 · 氢光谱 · 能级',desc:'',sections:[{name:'2.1 黑体辐射',color:'#2563eb',desc:'',items:[{id:'atomic_physics-c2s1-1',name:'黑体与热辐射',tags:["def", "thm", "der", "app", "note"],brief:'黑体是对所有波长都完全吸收、无反射的理想物体。任何物体都发出热辐射，其单色辐射本领只由温度决定，与材料无关。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>黑体是对所有波长都完全吸收、无反射的理想物体。任何物体都发出热辐射，其单色辐射本领只由温度决定，与材料无关。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R(\\lambda,T)\\ \\text{只依赖}\\ T,\\quad R(T)=\\int_0^\\infty R(\\lambda,T)\\,d\\lambda$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用带小孔的空腔近似黑体：进入的光在腔内多次反射被完全吸收。实验测得不同温度下的连续谱，峰值随温度移动。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>黑体辐射是量子概念诞生的起点，也是测温与红外技术的物理基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>黑体不反射但会辐射，其辐射谱是普适函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>基尔霍夫 1859 年提出黑体概念与辐射定律。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>宇宙微波背景辐射是温度 2.7 K 的近乎完美的黑体谱。</p></section></div>`},{id:'atomic_physics-c2s1-2',name:'维恩位移定律',tags:["def", "thm", "der", "app", "note"],brief:'黑体辐射谱的峰值波长与温度成反比：温度越高，峰值越向短波（蓝）方向移动。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>黑体辐射谱的峰值波长与温度成反比：温度越高，峰值越向短波（蓝）方向移动。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lambda_m T=0.2898\\ \\mathrm{cm\\cdot K}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由普朗克公式对 $\\lambda$ 求导并令其为零，得超越方程 $x=5(1-e^{-x})$，解 $x\\approx4.965$，代入即得维恩常数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用于光学高温计测温、恒星表面温度测定（由颜色判断温度）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>该定律只在峰值处成立，不能给出整个谱形。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>维恩 1893 年由热力学论证得到，早于普朗克公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>太阳峰值约 500 nm，对应表面温度约 5800 K。</p></section></div>`},{id:'atomic_physics-c2s1-3',name:'普朗克辐射公式',tags:["def", "thm", "der", "app", "note"],brief:'普朗克公式给出黑体辐射的能量密度谱，在长波与短波极限分别退化为瑞利-金斯公式与维恩公式，是第一个完整的黑体谱公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>普朗克公式给出黑体辐射的能量密度谱，在长波与短波极限分别退化为瑞利-金斯公式与维恩公式，是第一个完整的黑体谱公式。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(\\nu,T)\\,d\\nu=\\frac{8\\pi h\\nu^3}{c^3}\\frac{d\\nu}{e^{h\\nu/kT}-1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>普朗克假设振子能量只能取 $nh\\nu$，用玻尔兹曼分布求和得平均能量 $\\bar\\varepsilon=\\frac{h\\nu}{e^{h\\nu/kT}-1}$，再乘以模式密度 $8\\pi\\nu^2/c^3$，即得本式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>奠定量子论，$h$ 成为基本常数；用于辐射测温与红外探测标定。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常数 $h=6.63\\times10^{-34}\\,\\mathrm{J\\cdot s}$，$k=1.38\\times10^{-23}\\,\\mathrm{J/K}$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>普朗克 1900 年 12 月 14 日在柏林学会宣读，被视为量子力学诞生日。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>由 $E(\\nu,T)$ 积分可得斯特凡-玻尔兹曼定律 $R=\\sigma T^4$。</p></section></div>`},{id:'atomic_physics-c2s1-4',name:'斯特凡-玻尔兹曼定律',tags:["def", "thm", "der", "app", "note"],brief:'黑体单位面积的总辐射功率与绝对温度的四次方成正比，是黑体辐射谱的积分结果。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>黑体单位面积的总辐射功率与绝对温度的四次方成正比，是黑体辐射谱的积分结果。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R(T)=\\sigma T^4,\\quad \\sigma=5.67\\times10^{-8}\\ \\mathrm{W\\,m^{-2}K^{-4}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对普朗克公式在全谱积分：$\\int_0^\\infty\\frac{x^3}{e^x-1}dx=\\frac{\\pi^4}{15}$，整理得 $\\sigma=\\frac{2\\pi^5k^4}{15h^3c^2}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>估算恒星、灯丝与人体辐射功率，是热辐射工程的基本公式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>真实物体用发射率 $\\varepsilon&lt;1$ 修正：$R=\\varepsilon\\sigma T^4$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>斯特凡 1879 年由实验发现，玻尔兹曼 1884 年由热力学导出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与维恩位移定律一起，构成黑体辐射的两个宏观规律。</p></section></div>`}]},{name:'2.2 光电效应',color:'#7c3aed',desc:'',items:[{id:'atomic_physics-c2s2-1',name:'光子与爱因斯坦假设',tags:["def", "thm", "der", "app", "note"],brief:'爱因斯坦 1905 年提出光由能量为 $h\\nu$ 的光子组成，光子是光的能量量子，兼有粒子性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>爱因斯坦 1905 年提出光由能量为 $h\\nu$ 的光子组成，光子是光的能量量子，兼有粒子性。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E=h\\nu,\\quad p=\\frac{h}{\\lambda}=\\hbar k$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由相对论 $E=mc^2$ 与 $p=mc$ 得 $p=E/c=h\\nu/c=h/\\lambda$，即光子动量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释光电效应、康普顿散射与光化学过程，是波粒二象性的第一个直接证据。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>光子静质量为零，永远以光速运动。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>爱因斯坦 1905 年提出，1921 年获诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>光子概念后来由康普顿散射（1923）进一步确证。</p></section></div>`},{id:'atomic_physics-c2s2-2',name:'爱因斯坦光电方程',tags:["def", "thm", "der", "app", "note"],brief:'光电子的最大初动能等于入射光子能量减去逸出功 $\\varphi$：只有当 $h\\nu>\\varphi$ 时才有光电子，且…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>光电子的最大初动能等于入射光子能量减去逸出功 $\\varphi$：只有当 $h\\nu>\\varphi$ 时才有光电子，且最大动能只与频率有关、与光强无关。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$eU_0=\\frac12mv_{\\max}^2=h\\nu-\\varphi$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>能量守恒：光子把全部能量交给电子，电子克服逸出功后剩余部分变为动能。$U_0$ 为遏止电压，使光电流恰好为零。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用于光电倍增管、光电池、CCD 与光电传感器设计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>光强只影响光子数（饱和电流），不改变单光子能量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>爱因斯坦 1905 年提出，密立根 1916 年精确验证。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>逸出功 $\\varphi$ 是材料属性，碱金属约 2 eV，铂约 6 eV。</p></section></div>`},{id:'atomic_physics-c2s2-3',name:'遏止电压与红限频率',tags:["def", "thm", "der", "app", "note"],brief:'遏止电压 $U_0$ 与频率成线性关系，直线的斜率 $h/e$ 是普适常数，横轴截距给出红限频率 $\\nu_0$；低于该…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>遏止电压 $U_0$ 与频率成线性关系，直线的斜率 $h/e$ 是普适常数，横轴截距给出红限频率 $\\nu_0$；低于该频率无论光多强都不发生光电效应。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$U_0=\\frac{h}{e}\\nu-\\frac{\\varphi}{e},\\quad \\nu_0=\\frac{\\varphi}{h}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由光电方程直接读出：$U_0$ 对 $\\nu$ 作图，斜率 $h/e$、截距 $-\\varphi/e$。密立根用此法测得 $h$，与普朗克值一致。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>测定普朗克常数与材料逸出功，是量子论最早的定量验证。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>红限对应光子能量恰好等于逸出功，此时光电子动能为零。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>密立根 1916 年完成精密测量，起初反对光子说，后因实验证据接受。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不同材料的红限不同，故光电管需按波长选择阴极材料。</p></section></div>`},{id:'atomic_physics-c2s2-4',name:'光电效应的四条实验规律',tags:["def", "thm", "der", "app", "note"],brief:'①响应几乎瞬时（纳秒内）；②饱和光电流与光强成正比；③遏止电压只与频率有关；④存在红限。这四条经典波动理论都无法解释。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>①响应几乎瞬时（纳秒内）；②饱和光电流与光强成正比；③遏止电压只与频率有关；④存在红限。这四条经典波动理论都无法解释。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$t&lt;10^{-9}\\,\\mathrm{s},\\quad i\\propto I,\\quad U_0\\ \\text{只依赖}\\ \\nu,\\quad \\nu&lt;\\nu_0\\ \\text{无效应}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>瞬时性源于单光子吸收；$i\\propto I$ 源于光子数正比于光强；$U_0$ 与 $\\nu$ 的线性关系源于单光子能量；红限源于能量阈值。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>逐条对照经典理论，凸显光的粒子性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>经典波动理论预言电子需积累能量，存在滞后，与实验矛盾。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>赫兹 1887 年首次观察到，勒纳德 1902 年系统研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>这四条规律是爱因斯坦光子说的实验依据。</p></section></div>`}]},{name:'2.3 氢原子光谱',color:'#0f766e',desc:'',items:[{id:'atomic_physics-c2s3-1',name:'波数与里德伯方程',tags:["def", "thm", "der", "app", "note"],brief:'氢原子光谱线的波数可写成两个整数的倒数平方差乘以里德伯常数，$R_H=1.097\\times10^7\\,\\mathrm{…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>氢原子光谱线的波数可写成两个整数的倒数平方差乘以里德伯常数，$R_H=1.097\\times10^7\\,\\mathrm{m^{-1}}$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\tilde\\nu=\\frac{1}{\\lambda}=R_H\\left(\\frac{1}{n^2}-\\frac{1}{n′^2}\\right),\\quad n′&lt;n$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>巴尔末 1885 年由可见光谱线归纳出经验公式；里德伯 1888 年推广到其他线系，写成上述普遍形式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>是玻尔模型最重要的实验依据，也是量子化能级的直接证据。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>谱线波长由两个能级差决定，而非单能级决定，这提示了能级结构。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>巴尔末 1885 年、里德伯 1888 年。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>氢的同位素氘的里德伯常数略有不同，可用于同位素位移分析。</p></section></div>`},{id:'atomic_physics-c2s3-2',name:'氢光谱的线系',tags:["def", "thm", "der", "app", "note"],brief:'氢光谱按末态主量子数分为若干线系：莱曼系（紫外）、巴耳末系（可见）、帕邢系（红外）等，各系谱线向短波方向密集收敛于系限。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>氢光谱按末态主量子数分为若干线系：莱曼系（紫外）、巴耳末系（可见）、帕邢系（红外）等，各系谱线向短波方向密集收敛于系限。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{莱曼 }n=1,\\ \\text{巴耳末 }n=2,\\ \\text{帕邢 }n=3,\\ \\text{布拉开 }n=4,\\ \\text{普丰德 }n=5$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令 $n′=n+1,n+2,\\ldots$，波长随 $n′$ 增大而趋近系限 $\\lambda_\\infty=1/(R_H/n^2)$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用于光谱分析、天体光谱测距与等离子体诊断。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>系限对应自由电子被俘获到该能级，即电离限。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>莱曼系 1914 年、帕邢系 1908 年相继在实验中发现。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>类氢离子光谱按 $Z^2R$ 标度，可用来鉴别离子种类。</p></section></div>`},{id:'atomic_physics-c2s3-3',name:'光谱项的量子化解释',tags:["def", "thm", "der", "app", "note"],brief:'把每个能级对应一个光谱项 $T(n)=R/n^2$，谱线波数等于两项之差，这为玻尔的能级量子化提供了形式基础。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把每个能级对应一个光谱项 $T(n)=R/n^2$，谱线波数等于两项之差，这为玻尔的能级量子化提供了形式基础。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$T(n)=\\frac{R}{n^2},\\quad \\tilde\\nu=T(n)-T(n′)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>里德伯-里兹组合原理：任何谱线波数都可写成两项之差，说明原子存在离散的能级。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>把光谱规律翻译成能级语言，直接导向玻尔模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>组合原理对复杂原子也成立，是原子光谱学的基石。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>里兹 1908 年提出组合原理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>光谱项概念后来发展为量子力学的本征值问题。</p></section></div>`}]},{name:'2.4 玻尔理论',color:'#c2410c',desc:'',items:[{id:'atomic_physics-c2s4-1',name:'玻尔的三条假设',tags:["def", "thm", "der", "app", "note"],brief:'①电子只能在一系列分立的定态轨道上运动，不辐射能量；②电子在定态间跃迁时吸收或辐射光子，频率满足 $h\\nu=E_{n′…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>①电子只能在一系列分立的定态轨道上运动，不辐射能量；②电子在定态间跃迁时吸收或辐射光子，频率满足 $h\\nu=E_{n′}-E_n$；③角动量量子化 $L=n\\hbar$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{定态}\\ +\\ h\\nu=E_{n′}-E_n\\ +\\ L=n\\hbar$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>定态假设解决原子稳定性；频率条件连接光谱；角动量量子化从氢光谱反推而来（当时无理论依据）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>第一次把量子概念用于原子结构，成功解释氢光谱与原子稳定性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>角动量量子化后来由德布罗意驻波条件 $2\\pi r=n\\lambda$ 给出物理解释。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>玻尔 1913 年发表三部曲论文。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>玻尔模型是「半经典」的：轨道经典、量子条件外加。</p></section></div>`},{id:'atomic_physics-c2s4-2',name:'轨道半径与能级的推导',tags:["def", "thm", "der", "app", "note"],brief:'由库仑力提供向心力与角动量量子化联立，可得第 $n$ 个轨道的半径与能量，二者都按 $n^2$ 标度，能量为负表示束缚态…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由库仑力提供向心力与角动量量子化联立，可得第 $n$ 个轨道的半径与能量，二者都按 $n^2$ 标度，能量为负表示束缚态。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r_n=\\frac{4\\pi\\varepsilon_0\\hbar^2}{m_ee^2}n^2,\\quad E_n=-\\frac{m_ee^4}{2(4\\pi\\varepsilon_0)^2\\hbar^2}\\frac{1}{n^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>①向心力：$\\frac{m_ev^2}{r}=\\frac{e^2}{4\\pi\\varepsilon_0r^2}$；②量子化：$m_evr=n\\hbar$。联立消去 $v$ 得 $r_n=\\frac{4\\pi\\varepsilon_0\\hbar^2}{m_ee^2}n^2=a_1n^2$。③总能量 $E=\\frac12m_ev^2-\\frac{e^2}{4\\pi\\varepsilon_0r}=-\\frac{e^2}{8\\pi\\varepsilon_0r}$，代入 $r_n$ 得 $E_n=-\\frac{13.6}{n^2}\\,\\mathrm{eV}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>给出玻尔半径 $a_1=0.053\\,\\mathrm{nm}$ 与氢原子能级公式，是原子物理最基本的定量结果。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>基态能量 $-13.6\\,\\mathrm{eV}$，电离能 13.6 eV；能级间隔随 $n$ 增大而减小，趋于连续。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>玻尔 1913 年推导，与氢光谱精确符合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>引入精细结构常数 $\\alpha=\\frac{e^2}{4\\pi\\varepsilon_0\\hbar c}\\approx1/137$，则 $E_1=-\\frac12m_ec^2\\alpha^2$。</p></section></div>`},{id:'atomic_physics-c2s4-3',name:'里德伯常数的理论值',tags:["def", "thm", "der", "app", "note"],brief:'由玻尔能级公式代入频率条件 $h\\nu=E_{n′}-E_n$，与里德伯方程比较，即可从基本常数算出里德伯常数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由玻尔能级公式代入频率条件 $h\\nu=E_{n′}-E_n$，与里德伯方程比较，即可从基本常数算出里德伯常数。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R_\\infty=\\frac{m_ee^4}{2(4\\pi\\varepsilon_0)^2\\hbar^3c}=1.097\\times10^7\\ \\mathrm{m^{-1}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>$h\\nu=\\frac{m_ee^4}{2(4\\pi\\varepsilon_0)^2\\hbar^2}\\left(\\frac{1}{n^2}-\\frac{1}{n′^2}\\right)$，两边除以 $hc$，得 $\\tilde\\nu=\\frac{m_ee^4}{2(4\\pi\\varepsilon_0)^2\\hbar^3c}\\left(\\frac{1}{n^2}-\\frac{1}{n′^2}\\right)$，即 $R_\\infty$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>理论值与实验值吻合到千分之一，是玻尔模型的重大成功。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>剩余差异由原子核的有限质量（约化质量修正）解释。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>玻尔 1913 年给出该推导。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>用 $R_\\infty$ 可反演基本常数组合，历史上曾用于精密测定 $e/m_e$。</p></section></div>`},{id:'atomic_physics-c2s4-4',name:'对应原理',tags:["def", "thm", "der", "app", "note"],brief:'当量子数很大时，量子体系的行为应趋于经典。玻尔用此原理确认了能级公式与辐射频率在 $n\\gg1$ 时与经典轨道频率一致。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当量子数很大时，量子体系的行为应趋于经典。玻尔用此原理确认了能级公式与辐射频率在 $n\\gg1$ 时与经典轨道频率一致。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lim_{n\\to\\infty}\\Delta E=h\\nu_{\\text{classical}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>相邻能级差 $\\Delta E=E_{n+1}-E_n\\approx\\frac{2R hc}{n^3}$，经典绕转频率 $\\nu_{\\text{cl}}=\\frac{v}{2\\pi r}=\\frac{2Rc}{n^3}$，二者相等，验证了对应关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>是构造量子理论的重要启发式原则，也是玻尔模型自洽性的检验。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对应原理后来成为量子力学与经典力学衔接的普遍要求。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>玻尔 1918–1920 年系统阐述。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该原理在量子电动力学与半经典近似中仍有指导意义。</p></section></div>`}]},{name:'2.5 类氢离子与修正',color:'#0891b2',desc:'',items:[{id:'atomic_physics-c2s5-1',name:'类氢离子光谱',tags:["def", "thm", "der", "app", "note"],brief:'只有一个核外电子的离子（He⁺、Li²⁺、Be³⁺…）称类氢离子，其光谱与氢相似，但所有能量按 $Z^2$ 放大。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只有一个核外电子的离子（He⁺、Li²⁺、Be³⁺…）称类氢离子，其光谱与氢相似，但所有能量按 $Z^2$ 放大。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\tilde\\nu=R_AZ^2\\left(\\frac{1}{n^2}-\\frac{1}{n′^2}\\right),\\quad E_n=-\\frac{R_AhcZ^2}{n^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把库仑力中的 $e^2$ 换成 $Ze^2$，重复玻尔推导：$r_n=\\frac{4\\pi\\varepsilon_0\\hbar^2}{m_ee^2}\\frac{n^2}{Z}$，$E_n\\propto Z^2/n^2$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用于等离子体诊断、天体光谱中高电离态离子的识别。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同一 $n$ 的轨道半径随 $Z$ 减小，能级随 $Z^2$ 加深。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>帕邢 1916 年在 He⁺ 光谱中验证了 $Z^2$ 标度。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>类氢离子是检验量子电动力学（Lamb 位移）的重要体系。</p></section></div>`},{id:'atomic_physics-c2s5-2',name:'约化质量修正',tags:["def", "thm", "der", "app", "note"],brief:'原子核并非固定不动，电子与核绕共同质心运动。用约化质量 $\\mu$ 替代 $m_e$，可修正里德伯常数，使理论与实验精确…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>原子核并非固定不动，电子与核绕共同质心运动。用约化质量 $\\mu$ 替代 $m_e$，可修正里德伯常数，使理论与实验精确符合。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R_A=R_\\infty\\frac{1}{1+m_e/M_A},\\quad \\mu=\\frac{m_eM_A}{m_e+M_A}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两体问题化为单体问题：相对运动方程中的质量换成 $\\mu$，所有含 $m_e$ 的结果乘以 $\\mu/m_e$，故 $R_A=R_\\infty\\frac{M_A}{M_A+m_e}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释氢与氘的光谱微小差异（同位素位移），是天文学测定同位素丰度的方法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>修正量约 $m_e/M_p\\approx1/1836$，对重元素更小。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该修正由玻尔与尼科尔森 1914 年前后讨论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>氘的发现（1932）即借助其光谱线的同位素位移。</p></section></div>`},{id:'atomic_physics-c2s5-3',name:'玻尔半径与精细结构常数',tags:["def", "thm", "der", "app", "note"],brief:'玻尔半径是氢原子基态轨道半径，也是原子尺度的自然单位；精细结构常数 $\\alpha$ 表征电磁相互作用强度，是无量纲常数…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>玻尔半径是氢原子基态轨道半径，也是原子尺度的自然单位；精细结构常数 $\\alpha$ 表征电磁相互作用强度，是无量纲常数。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_1=\\frac{4\\pi\\varepsilon_0\\hbar^2}{m_ee^2}=0.0529\\ \\mathrm{nm},\\quad \\alpha=\\frac{e^2}{4\\pi\\varepsilon_0\\hbar c}\\approx\\frac{1}{137}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $a_1$ 与 $\\alpha$ 的关系 $a_1=\\frac{\\hbar}{m_ec\\alpha}$，可得 $E_1=-\\frac12m_ec^2\\alpha^2$，说明原子能级是电子静能的 $\\alpha^2$ 量级。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>作为原子物理的标尺，用于估算能级、截面与跃迁速率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\alpha$ 的数值决定了原子光谱精细结构裂距的相对大小（约 $\\alpha^2$）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>索末菲 1916 年引入精细结构常数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>$\\alpha$ 是否为常数是精密测量与宇宙学的重要课题。</p></section></div>`},{id:'atomic_physics-c2s5-4',name:'电离能与结合能',tags:["def", "thm", "der", "app", "note"],brief:'把电子从基态移到无穷远所需的能量称电离能；反之，自由电子与核结合成基态释放的能量称结合能，二者数值相等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把电子从基态移到无穷远所需的能量称电离能；反之，自由电子与核结合成基态释放的能量称结合能，二者数值相等。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E_{\\text{ion}}=13.6\\ \\mathrm{eV}\\ (Z=1),\\quad E_{\\text{ion}}=13.6Z^2\\ \\mathrm{eV}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $E_n=-13.6Z^2/n^2\\,\\mathrm{eV}$，取 $n=1$ 与 $n\\to\\infty$ 之差即得。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>决定元素的电离电位、等离子体温度与光谱激发条件。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>激发能（到第一激发态）只有电离能的 $3/4$（氢），是光谱激发的门槛。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该数值来自玻尔模型，与实验值 13.598 eV 一致。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多电子原子的电离能需逐级定义，且因屏蔽而偏离 $Z^2$ 规律。</p></section></div>`}]}]},
{id:'atomic_physics-ch3',num:'第3章',title:'量子力学导论',en:'QUANTUM MECHANICS',sub:'波粒二象性 · 不确定关系 · 波函数 · 薛定谔方程',desc:'',sections:[{name:'3.1 波粒二象性',color:'#2563eb',desc:'',items:[{id:'atomic_physics-c3s1-1',name:'光子动量',tags:["def", "thm", "der", "app", "note"],brief:'光子不仅带能量 $h\\nu$，也带动量 $h/\\lambda$。动量与波长的对应是波粒二象性的定量表达。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>光子不仅带能量 $h\\nu$，也带动量 $h/\\lambda$。动量与波长的对应是波粒二象性的定量表达。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$p=\\frac{h}{\\lambda}=\\hbar k,\\quad E=h\\nu=\\hbar\\omega$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由相对论 $E^2=p^2c^2+m^2c^4$，光子静质量为零，故 $p=E/c=h\\nu/c=h/\\lambda$；又 $k=2\\pi/\\lambda$，得 $p=\\hbar k$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用于光压、激光冷却、光镊与康普顿散射的计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>光子动量虽小（可见光约 $10^{-27}\\,\\mathrm{kg\\cdot m/s}$），但可累积产生显著光压。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>爱因斯坦 1905 年给出光量子能量，康普顿 1923 年由散射确认动量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>太阳帆与光镊（2018 年诺贝尔奖）都依赖光子动量。</p></section></div>`},{id:'atomic_physics-c3s1-2',name:'德布罗意波',tags:["def", "thm", "der", "app", "note"],brief:'德布罗意 1924 年假设实物粒子也具有波动性，其波长由动量决定。电子、中子、原子甚至分子都能产生衍射。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>德布罗意 1924 年假设实物粒子也具有波动性，其波长由动量决定。电子、中子、原子甚至分子都能产生衍射。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lambda=\\frac{h}{p},\\quad \\nu=\\frac{E}{h}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>受光子关系启发，把 $p=h/\\lambda$、$E=h\\nu$ 推广到所有粒子；由相对论可写成 $\\lambda=\\frac{h}{mc}\\frac{1}{\\beta}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>电子衍射、中子衍射是研究晶体结构的手段；电子显微镜的分辨率受此波长限制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>宏观物体波长极小（$1\\,\\mathrm{g}$、$1\\,\\mathrm{m/s}$ 时约 $10^{-31}\\,\\mathrm{m}$），故观察不到波动性。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>德布罗意 1924 年博士论文提出，1929 年获诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>戴维孙-革末 1927 年用电子在镍单晶上的衍射直接验证。</p></section></div>`},{id:'atomic_physics-c3s1-3',name:'驻波条件与轨道量子化',tags:["def", "thm", "der", "app", "note"],brief:'把电子轨道看成环形驻波，只有周长等于整数个波长时才稳定，这自然给出玻尔的角动量量子化条件。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把电子轨道看成环形驻波，只有周长等于整数个波长时才稳定，这自然给出玻尔的角动量量子化条件。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$2\\pi r=n\\lambda=n\\frac{h}{p}\\ \\Rightarrow\\ mvr=n\\hbar$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\lambda=h/(mv)$ 代入 $2\\pi r=n\\lambda$，得 $mvr=nh/2\\pi=n\\hbar$，与玻尔假设完全一致，从而为它提供物理解释。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>说明量子化不是人为假设，而是波动性的必然结果。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>该图像只适用于闭合轨道，不能解释非束缚态。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>德布罗意 1924 年提出，是玻尔模型与量子力学的桥梁。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同样的驻波思想可用于解释量子阱、量子环的能级。</p></section></div>`},{id:'atomic_physics-c3s1-4',name:'一维箱中的能量量子化',tags:["def", "thm", "der", "app", "note"],brief:'宽度为 $d$ 的一维无限深势阱中，粒子只能取分立的能级，能量按 $n^2$ 增长，最低能量不为零。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>宽度为 $d$ 的一维无限深势阱中，粒子只能取分立的能级，能量按 $n^2$ 增长，最低能量不为零。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$p=\\frac{nh}{2d},\\quad E_n=\\frac{n^2h^2}{8md^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>驻波条件 $n\\frac{\\lambda}{2}=d$ 给出 $\\lambda=2d/n$，由 $p=h/\\lambda$ 得 $p=nh/(2d)$，再代入 $E=p^2/(2m)$ 得能级。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释量子阱激光器、量子点与纳米结构的能级结构。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>零点能 $E_1=h^2/(8md^2)\\neq0$，是不确定关系的直接体现。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该结果是薛定谔方程最简单的精确解。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>能级间距 $\\propto1/d^2$，尺寸越小量子效应越显著。</p></section></div>`}]},{name:'3.2 不确定关系',color:'#7c3aed',desc:'',items:[{id:'atomic_physics-c3s2-1',name:'位置-动量不确定关系',tags:["def", "thm", "der", "app", "note"],brief:'粒子的位置与动量不能同时具有确定值；两者不确定度的乘积有下限 $\\hbar/2$。这是量子力学的内在限制，而非测量技术的…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>粒子的位置与动量不能同时具有确定值；两者不确定度的乘积有下限 $\\hbar/2$。这是量子力学的内在限制，而非测量技术的不足。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta x\\,\\Delta p\\ge\\frac{\\hbar}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由波包分析：位置越确定（波包越窄），动量谱越宽。严格的推导用柯西-施瓦茨不等式作用于波函数与其傅里叶变换，得 $\\Delta x\\Delta p\\ge\\hbar/2$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释零点能、原子稳定性、单缝衍射的角展宽。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\Delta x\\to0$ 时 $\\Delta p\\to\\infty$，故电子不能被「定」在核内。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>海森伯 1927 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该关系是量子力学的基本原理，不属于测量扰动。</p></section></div>`},{id:'atomic_physics-c3s2-2',name:'能量-时间不确定关系',tags:["def", "thm", "der", "app", "note"],brief:'体系能量的不确定度与它在该状态停留的时间成反比，寿命越短，能级越宽。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>体系能量的不确定度与它在该状态停留的时间成反比，寿命越短，能级越宽。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta E\\,\\Delta t\\ge\\frac{\\hbar}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $E=h\\nu$、$\\Delta t\\cdot\\Delta\\nu\\ge1$ 结合 $\\Delta E=h\\Delta\\nu$ 得到；严格的量子力学版本需定义 $\\Delta t$ 为态演化的时间尺度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释谱线自然宽度、虚粒子的短暂存在、隧穿时间。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>激发态寿命 $\\tau$ 对应能级宽度 $\\Gamma\\approx\\hbar/\\tau$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>海森伯 1927 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该关系是共振与衰变现象的统一描述。</p></section></div>`},{id:'atomic_physics-c3s2-3',name:'不确定关系的波包推导',tags:["def", "thm", "der", "app", "note"],brief:'两列频率相近的波叠加形成拍（波包）。波包的空间长度与波长展宽成反比，代入德布罗意关系即得不确关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两列频率相近的波叠加形成拍（波包）。波包的空间长度与波长展宽成反比，代入德布罗意关系即得不确关系。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta x\\,\\Delta\\lambda\\ge\\lambda^2\\ \\Rightarrow\\ \\Delta x\\,\\Delta p\\ge h$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设 $\\nu_1,\\nu_2$ 产生拍，持续时间 $\\Delta t\\ge1/|\\nu_1-\\nu_2|=1/\\Delta\\nu$；波包长度 $\\Delta x=c\\Delta t\\ge c/\\Delta\\nu$。由 $\\lambda=c/\\nu$ 得 $\\Delta\\lambda=\\lambda^2\\Delta\\nu/c$，故 $\\Delta x\\Delta\\lambda\\ge\\lambda^2$，再乘 $h$ 得 $\\Delta x\\Delta p\\ge h$。精细分析把系数改进为 $\\hbar/2$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>从波动图像直观理解不确定关系，说明它是波的本性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>用 $h$ 还是 $\\hbar/2$ 取决于对不确定度的定义（标准偏差 vs 全宽）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该推导见于讲义中的「拍」图示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>更严格的处理用傅里叶变换的带宽定理。</p></section></div>`},{id:'atomic_physics-c3s2-4',name:'不确定关系的应用估算',tags:["def", "thm", "der", "app", "note"],brief:'不确定关系可用于量级估算束缚能、零点能与临界尺度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不确定关系可用于量级估算束缚能、零点能与临界尺度。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta p\\sim\\frac{\\hbar}{\\Delta x}\\ \\Rightarrow\\ E\\sim\\frac{\\hbar^2}{2m(\\Delta x)^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把电子限制在 $\\Delta x\\sim a_1$ 内，则动能 $\\sim\\frac{\\hbar^2}{2m_ea_1^2}\\approx13.6\\,\\mathrm{eV}$，恰为氢原子结合能的量级。若限制在核尺度 $10^{-15}\\,\\mathrm{m}$，则能量达 MeV 量级，电子无法束缚在核内。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>快速估算原子、分子与核的尺度与能量，判断物理过程是否可能。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>估算只给量级，精确值需解薛定谔方程。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>费米曾用类似估算解释 β 衰变能量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该方法是量子物理中最重要的「数量级直觉」。</p></section></div>`}]},{name:'3.3 波函数与叠加原理',color:'#0f766e',desc:'',items:[{id:'atomic_physics-c3s3-1',name:'波函数与概率密度',tags:["def", "thm", "der", "app", "note"],brief:'量子态由波函数 $\\psi$ 描述，$|\\psi|^2$ 是发现粒子的概率密度。波函数本身不可直接测量，只有模方能对应可…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>量子态由波函数 $\\psi$ 描述，$|\\psi|^2$ 是发现粒子的概率密度。波函数本身不可直接测量，只有模方能对应可观测的概率。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\psi(x,t)=\\psi_0e^{i(kx-\\omega t)},\\quad P=|\\psi|^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由德布罗意关系构造平面波 $\\psi=\\psi_0e^{i(kx-\\omega t)}$，其模方为常数，对应动量完全确定的自由粒子（位置完全不确定）。局域粒子需用波包（多个平面波叠加）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>所有量子计算的概率预言都来自 $|\\psi|^2$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>波函数必须单值、连续、平方可积，且满足归一化 $\\int|\\psi|^2dx=1$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>玻恩 1926 年提出概率诠释。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相位不可直接观测，但相位差决定干涉。</p></section></div>`},{id:'atomic_physics-c3s3-2',name:'归一化条件',tags:["def", "thm", "der", "app", "note"],brief:'粒子必定出现在空间某处，故概率密度在全空间的积分为 1。归一化把波函数的绝对幅度固定下来。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>粒子必定出现在空间某处，故概率密度在全空间的积分为 1。归一化把波函数的绝对幅度固定下来。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\int_{-\\infty}^{\\infty}|\\psi(x,t)|^2dx=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若 $\\int|\\psi|^2dx=N$，则令 $\\psi′=\\psi/\\sqrt{N}$ 即归一化。归一化不随时间改变，因为概率守恒。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算期望值、跃迁概率与测量结果分布的前提。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>束缚态可归一化；自由粒子的平面波不能归一化，需用箱归一化或波包。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>归一化概念由玻恩 1926 年引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>归一化守恒等价于薛定谔方程的概率流连续性方程。</p></section></div>`},{id:'atomic_physics-c3s3-3',name:'态的叠加原理',tags:["def", "thm", "der", "app", "note"],brief:'若体系可处于态 $|\\psi_1\\rangle$ 或 $|\\psi_2\\rangle$，则也可处于它们的任意线性叠加；测…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若体系可处于态 $|\\psi_1\\rangle$ 或 $|\\psi_2\\rangle$，则也可处于它们的任意线性叠加；测量时以 $|c_n|^2$ 的概率得到本征态 $n$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\psi\\rangle=\\sum_n c_n|\\psi_n\\rangle,\\quad P_n=|c_n|^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>叠加原理包含四条规则：①同一末态有多种不可区分方式，则振幅相加 $\\langle f|i\\rangle=\\sum_n\\langle f|i\\rangle_n$；②不同末态则概率相加；③经过中间态则振幅相乘 $\\langle f|i\\rangle=\\langle f|v\\rangle\\langle v|i\\rangle$；④两粒子独立则总振幅为乘积。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>是量子干涉、纠缠与量子并行性的根源。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>叠加是概率幅的叠加，不是概率的叠加，这是量子与经典的本质区别。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>狄拉克 1930 年用态矢量系统表述。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>双缝干涉即规则①的直接体现：两条路径不可区分，振幅相加。</p></section></div>`},{id:'atomic_physics-c3s3-4',name:'期望值与方差',tags:["def", "thm", "der", "app", "note"],brief:'可观测量的期望值由算符 $\\hat A$ 在态上的平均给出，方差刻画测量结果的离散程度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>可观测量的期望值由算符 $\\hat A$ 在态上的平均给出，方差刻画测量结果的离散程度。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\langle A\\rangle=\\int\\psi^*\\hat A\\psi\\,dx,\\quad (\\Delta A)^2=\\langle A^2\\rangle-\\langle A\\rangle^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把 $\\hat A$ 作用于波函数再与 $\\psi^*$ 内积，即得期望；对位置 $\\hat x=x$、对动量 $\\hat p=-i\\hbar\\partial_x$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>从波函数提取物理量，是量子力学与实验对接的方式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>若 $\\psi$ 是 $\\hat A$ 的本征态，则 $\\Delta A=0$，测量结果完全确定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>期望值概念源自冯·诺依曼 1932 年的公理化表述。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不确定关系可写成 $\\Delta x\\Delta p\\ge\\hbar/2$ 的算符形式。</p></section></div>`}]},{name:'3.4 薛定谔方程',color:'#c2410c',desc:'',items:[{id:'atomic_physics-c3s4-1',name:'一维薛定谔方程',tags:["def", "thm", "der", "app", "note"],brief:'薛定谔方程是量子力学的基本动力学方程，描述波函数随时间的演化，地位相当于经典力学中的牛顿方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>薛定谔方程是量子力学的基本动力学方程，描述波函数随时间的演化，地位相当于经典力学中的牛顿方程。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$-\\frac{\\hbar^2}{2m}\\frac{\\partial^2\\Psi}{\\partial x^2}+V(x)\\Psi=i\\hbar\\frac{\\partial\\Psi}{\\partial t}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $E=\\frac{p^2}{2m}+V$ 出发，作替换 $E\\to i\\hbar\\partial_t$、$p\\to-i\\hbar\\partial_x$，作用于波函数即得。它是线性方程，保证叠加原理成立。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求解原子、分子、固体中的电子态，是量子化学与凝聚态物理的出发点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>方程是假设，其正确性由实验检验；不能由经典力学严格推出。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>薛定谔 1926 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>方程对时间一阶、对空间二阶，故需初值条件与边界条件。</p></section></div>`},{id:'atomic_physics-c3s4-2',name:'三维薛定谔方程',tags:["def", "thm", "der", "app", "note"],brief:'把一维方程推广到三维，拉普拉斯算符 $\\nabla^2=\\partial_x^2+\\partial_y^2+\\parti…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把一维方程推广到三维，拉普拉斯算符 $\\nabla^2=\\partial_x^2+\\partial_y^2+\\partial_z^2$ 描述空间的弯曲扩散。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$-\\frac{\\hbar^2}{2m}\\nabla^2\\Psi+V(\\vec r)\\Psi=i\\hbar\\frac{\\partial\\Psi}{\\partial t}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\vec p\\to-i\\hbar\\nabla$、$p^2\\to-\\hbar^2\\nabla^2$ 替换得到；在球坐标下分离变量可解氢原子。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>处理真实三维体系（原子、分子、晶体）必须用三维方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>球对称势下角向部分给出球谐函数，量子数 $l,m$ 自然出现。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>薛定谔 1926 年给出三维形式并求解氢原子。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>氢原子的严格解是量子力学最成功的案例之一。</p></section></div>`},{id:'atomic_physics-c3s4-3',name:'定态薛定谔方程',tags:["def", "thm", "der", "app", "note"],brief:'当势能不显含时间时，可分离变量得到定态方程；其解 $\\psi$ 满足本征值方程，$E$ 为能量本征值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当势能不显含时间时，可分离变量得到定态方程；其解 $\\psi$ 满足本征值方程，$E$ 为能量本征值。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\left[-\\frac{\\hbar^2}{2m}\\nabla^2+V\\right]\\psi=E\\psi,\\quad \\Psi=\\psi e^{-iEt/\\hbar}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令 $\\Psi=\\psi(\\vec r)T(t)$，代入方程并两边除以 $\\Psi$，得左边只含空间、右边只含时间，故都等于常数 $E$。时间部分解为 $T=T_0e^{-iEt/\\hbar}$，空间部分即定态方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求能级与稳定态波函数，是原子物理的核心计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定态的几率密度 $|\\Psi|^2=|\\psi|^2$ 不随时间变化。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该分离变量法由薛定谔 1926 年使用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>束缚态能量离散，散射态能量连续。</p></section></div>`},{id:'atomic_physics-c3s4-4',name:'氢原子的量子力学解',tags:["def", "thm", "der", "app", "note"],brief:'在库仑势中分离变量，得到三个量子数 $n,l,m$ 标记的波函数，能量只依赖 $n$，与玻尔结果一致，但角动量与概率分布…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在库仑势中分离变量，得到三个量子数 $n,l,m$ 标记的波函数，能量只依赖 $n$，与玻尔结果一致，但角动量与概率分布更丰富。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\psi_{nlm}=R_{nl}(r)Y_{lm}(\\theta,\\varphi),\\quad E_n=-\\frac{13.6}{n^2}\\ \\mathrm{eV}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>球坐标下 $\\nabla^2$ 分解为径向与角向；角向方程给出球谐函数，要求 $l$ 为整数、$|m|\\le l$；径向方程给出拉盖尔多项式，要求 $n\\ge l+1$。能量本征值与玻尔公式相同，但波函数是概率云而非轨道。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释电子云形状、原子半径、轨道磁矩与光谱选择定则。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同一 $n$ 下 $l$ 不同的态能量简并（库仑势特有的 $l$ 简并），多电子原子中被破坏。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>薛定谔 1926 年、泡利 1926 年分别给出解。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>电子云图像取代了经典轨道，$|m|$ 决定角向分布的方向性。</p></section></div>`}]}]},
{id:'atomic_physics-ch4',num:'第4章',title:'电子自旋',en:'ELECTRON SPIN',sub:'磁矩 · 自旋 · 精细结构 · 塞曼效应',desc:'',sections:[{name:'4.1 轨道磁矩',color:'#2563eb',desc:'',items:[{id:'atomic_physics-c4s1-1',name:'轨道磁矩与旋磁比',tags:["def", "thm", "der", "app", "note"],brief:'电子绕核运动等效于闭合电流，产生轨道磁矩，方向与角动量相反（电子带负电），大小与角动量成正比。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电子绕核运动等效于闭合电流，产生轨道磁矩，方向与角动量相反（电子带负电），大小与角动量成正比。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec\\mu_l=-\\frac{e}{2m_e}\\vec L=-\\gamma\\vec L,\\quad \\gamma=\\frac{e}{2m_e}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等效电流 $i=-ev/(2\\pi r)$，磁矩 $\\mu=iS=-\\frac{ev}{2\\pi r}\\pi r^2=-\\frac{evr}{2}=-\\frac{e}{2m_e}L$，即得 $\\vec\\mu=-\\frac{e}{2m_e}\\vec L$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释原子磁性与磁场中原子的进动。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\gamma=e/2m_e$ 称轨道旋磁比，是经典预期的值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>轨道磁矩概念源自安培分子电流假说。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>自旋的旋磁比约为轨道的两倍，这是自旋存在的关键证据。</p></section></div>`},{id:'atomic_physics-c4s1-2',name:'拉莫尔进动',tags:["def", "thm", "der", "app", "note"],brief:'磁矩在均匀磁场中受到力矩 $\\vec\\tau=\\vec\\mu\\times\\vec B$，导致磁矩绕磁场方向匀速进动，角频…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>磁矩在均匀磁场中受到力矩 $\\vec\\tau=\\vec\\mu\\times\\vec B$，导致磁矩绕磁场方向匀速进动，角频率为拉莫尔频率。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{d\\vec\\mu}{dt}=\\vec\\omega\\times\\vec\\mu,\\quad \\omega_L=\\frac{eB}{2m_e}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角动量定理 $\\frac{d\\vec L}{dt}=\\vec\\mu\\times\\vec B$，结合 $\\vec\\mu=-\\gamma\\vec L$，得 $\\frac{d\\vec L}{dt}=-\\gamma\\vec B\\times\\vec L$，即绕 $\\vec B$ 进动，$\\omega_L=\\gamma B=eB/2m_e$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>核磁共振、电子自旋共振与原子磁强计的原理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>进动本身不改变磁矩与磁场的夹角，故不辐射能量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>拉莫尔 1897 年由经典电动力学导出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>拉莫尔进动是塞曼效应与磁共振的经典图像。</p></section></div>`},{id:'atomic_physics-c4s1-3',name:'磁矩的空间量子化',tags:["def", "thm", "der", "app", "note"],brief:'角动量在磁场方向只能取 $2l+1$ 个分立投影，故轨道磁矩的投影也是分立的，间隔为玻尔磁子 $\\mu_B$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>角动量在磁场方向只能取 $2l+1$ 个分立投影，故轨道磁矩的投影也是分立的，间隔为玻尔磁子 $\\mu_B$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mu_{l,z}=-m_l\\mu_B,\\quad m_l=-l,\\ldots,l$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $L_z=m_l\\hbar$ 与 $\\mu_z=-\\frac{e}{2m_e}L_z$ 得 $\\mu_z=-m_l\\frac{e\\hbar}{2m_e}=-m_l\\mu_B$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释斯特恩-盖拉赫实验的分裂、塞曼效应的谱线分裂。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>空间量子化是量子力学的普遍特征，与经典连续取向不同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>空间量子化的概念由玻尔与索末菲提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>斯特恩-盖拉赫实验（1922）首次直接观测到空间量子化。</p></section></div>`},{id:'atomic_physics-c4s1-4',name:'玻尔磁子',tags:["def", "thm", "der", "app", "note"],brief:'玻尔磁子是原子磁矩的自然单位，等于轨道角动量为 $\\hbar$ 时对应的磁矩。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>玻尔磁子是原子磁矩的自然单位，等于轨道角动量为 $\\hbar$ 时对应的磁矩。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mu_B=\\frac{e\\hbar}{2m_e}=9.274\\times10^{-24}\\ \\mathrm{J/T}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\mu_B=\\frac{e}{2m_e}\\hbar$ 定义；用精细结构常数可写成 $\\mu_B=\\frac12\\alpha eca_1$，把磁矩与原子尺度联系起来。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>作为原子磁性的标尺，用于计算塞曼分裂、磁化率与磁共振频率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>核磁矩的单位是核磁子 $\\mu_N=\\mu_Bm_e/M_p\\approx\\mu_B/1836$，比电子磁矩小三个量级。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>玻尔 1911 年引入该单位。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>$\\mu_B$ 是国际单位制中定义安培的参考常数之一。</p></section></div>`}]},{name:'4.2 自旋假设与原子态',color:'#7c3aed',desc:'',items:[{id:'atomic_physics-c4s2-1',name:'斯特恩-盖拉赫实验',tags:["def", "thm", "der", "app", "note"],brief:'银原子束通过不均匀磁场后分裂为两束（而非连续分布），直接证明原子磁矩的空间取向是量子化的，且电子具有半整数自旋。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>银原子束通过不均匀磁场后分裂为两束（而非连续分布），直接证明原子磁矩的空间取向是量子化的，且电子具有半整数自旋。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{银原子束}\\ \\to\\ \\text{不均匀磁场}\\ \\to\\ \\text{两束}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若只有轨道磁矩，$l=0$ 的银原子基态应不分裂；实验观察到两束分裂，说明存在与轨道无关的内禀磁矩——自旋。两束对应 $m_s=\\pm1/2$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>自旋存在的第一个直接实验证据。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分裂两束而非 $2l+1$ 束，是自旋 $s=1/2$ 的直接体现。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>斯特恩与盖拉赫 1922 年完成实验。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>现代版本用原子束或电子束，可用于制备自旋极化束。</p></section></div>`},{id:'atomic_physics-c4s2-2',name:'自旋量子数',tags:["def", "thm", "der", "app", "note"],brief:'电子具有内禀角动量（自旋），量子数 $s=1/2$，在任意方向上的投影只有 $\\pm\\hbar/2$ 两个值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电子具有内禀角动量（自旋），量子数 $s=1/2$，在任意方向上的投影只有 $\\pm\\hbar/2$ 两个值。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\vec S|=\\sqrt{s(s+1)}\\hbar,\\quad S_z=m_s\\hbar,\\quad s=\\frac12,\\ m_s=\\pm\\frac12$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由斯特恩-盖拉赫的两束分裂与碱金属双线，乌伦贝克与古兹密特 1925 年提出 $s=1/2$；狄拉克 1928 年由相对论量子力学自然导出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释精细结构、泡利原理与元素周期表的结构。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>自旋是纯量子效应，没有经典对应；电子自旋磁矩与角动量之比约为 $2\\times$ 轨道值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>乌伦贝克与古兹密特 1925 年提出自旋假设。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>自旋-统计定理：半整数自旋粒子是费米子，服从泡利原理。</p></section></div>`},{id:'atomic_physics-c4s2-3',name:'朗德 g 因子',tags:["def", "thm", "der", "app", "note"],brief:'朗德 $g$ 因子描述原子总磁矩与总角动量的比例关系，纯轨道 $g=1$、纯自旋 $g=2$，一般介于两者之间。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>朗德 $g$ 因子描述原子总磁矩与总角动量的比例关系，纯轨道 $g=1$、纯自旋 $g=2$，一般介于两者之间。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$g_J=\\frac32+\\frac{S(S+1)-L(L+1)}{2J(J+1)},\\quad \\mu_{J,z}=-m_Jg_J\\mu_B$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>总磁矩 $\\vec\\mu=\\vec\\mu_L+\\vec\\mu_S$，由于 $\\vec L$ 与 $\\vec S$ 绕 $\\vec J$ 进动，只有沿 $\\vec J$ 的分量有稳定贡献。取投影得 $\\mu_J=-g_J\\frac{e}{2m_e}J$，由矢量模型算出 $g_J$ 的表达式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算塞曼分裂、磁共振条件与原子磁矩。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$g_J$ 的数值可由量子数直接算出，是原子态的重要标签。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>朗德 1921 年由实验归纳，1925 年后由量子力学解释。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>电子自旋的 $g_s\\approx2.0023$，与 2 的微小偏差由量子电动力学解释。</p></section></div>`},{id:'atomic_physics-c4s2-4',name:'原子态符号',tags:["def", "thm", "der", "app", "note"],brief:'原子态用光谱符号表示：左上角为多重度 $2S+1$，字母表示总轨道角动量 $L$，右下角为总角动量 $J$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>原子态用光谱符号表示：左上角为多重度 $2S+1$，字母表示总轨道角动量 $L$，右下角为总角动量 $J$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$\${}^{2S+1}L_J,\\quad L=0\\to S,P,D,F,G,H,I,J$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $L$ 与 $S$ 耦合得 $J=L+S,\\ldots,|L-S|$，共 $2\\min(L,S)+1$ 个值；多重度 $2S+1$ 表示自旋取向数。例：$^{2}P_{3/2}$ 表示 $S=1/2$、$L=1$、$J=3/2$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一标记原子能级，是光谱分析与选择定则的语言。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>多重度 1 称单态、2 称双重态、3 称三重态。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>符号体系由罗素与桑德斯 1925 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>选择定则要求 $\\Delta S=0$、$\\Delta L=0,\\pm1$、$\\Delta J=0,\\pm1$。</p></section></div>`}]},{name:'4.3 自旋-轨道耦合',color:'#0f766e',desc:'',items:[{id:'atomic_physics-c4s3-1',name:'自旋-轨道耦合能',tags:["def", "thm", "der", "app", "note"],brief:'电子在核电场中运动时，在电子静止系看来核在绕它运动，产生等效磁场，与电子自旋磁矩相互作用，形成自旋-轨道耦合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电子在核电场中运动时，在电子静止系看来核在绕它运动，产生等效磁场，与电子自旋磁矩相互作用，形成自旋-轨道耦合。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$U=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Ze^2}{2m_e^2c^2r^3}\\vec S\\cdot\\vec L$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等效内场 $B=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Ze}{c^2r^3}L$，耦合能 $U=-\\vec\\mu_s\\cdot\\vec B$；代入 $\\vec\\mu_s=-\\frac{e}{m_e}\\vec S$ 得 $U=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Ze^2}{2m_e^2c^2r^3}\\vec S\\cdot\\vec L$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释碱金属双线、精细结构与原子能级的细致分裂。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>耦合能约 $10^{-4}\\,\\mathrm{eV}$，比主能级小两个数量级，故称「精细结构」。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该效应由乌伦贝克-古兹密特与托马斯 1926 年解释。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>托马斯基进动使实际耦合能减半，推导中需乘 1/2 因子。</p></section></div>`},{id:'atomic_physics-c4s3-2',name:'双线裂距',tags:["def", "thm", "der", "app", "note"],brief:'自旋-轨道耦合使同一 $l$ 的能级分裂为 $j=l\\pm1/2$ 两条，裂距随 $Z^4$ 迅速增大、随 $n^3$ …',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>自旋-轨道耦合使同一 $l$ 的能级分裂为 $j=l\\pm1/2$ 两条，裂距随 $Z^4$ 迅速增大、随 $n^3$ 减小。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta U=\\frac{Z^4}{n^3l(l+1)}\\times7.25\\times10^{-4}\\ \\mathrm{eV}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由 $\\vec S\\cdot\\vec L=\\frac12[J(J+1)-S(S+1)-L(L+1)]\\hbar^2$ 分别取 $j=l+1/2$ 与 $l-1/2$，两者之差即裂距；对氢原子做平均后得上述数值。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>碱金属光谱的双线（如钠 D 线 589.0/589.6 nm）即由此产生。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>裂距随原子序数 $Z$ 的四次方增长，重元素精细结构显著。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>该公式由索末菲与朗德早期工作给出，量子力学修正后形式一致。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>钠 D 双线是原子物理最著名的精细结构实例。</p></section></div>`},{id:'atomic_physics-c4s3-3',name:'精细结构与选择定则',tags:["def", "thm", "der", "app", "note"],brief:'考虑自旋-轨道耦合后，能级由 $(n,l,j)$ 标记；电偶极跃迁只允许 $\\Delta l=\\pm1$、$\\Delta…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>考虑自旋-轨道耦合后，能级由 $(n,l,j)$ 标记；电偶极跃迁只允许 $\\Delta l=\\pm1$、$\\Delta j=0,\\pm1$ 的跃迁。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta l=\\pm1,\\quad \\Delta j=0,\\pm1,\\quad \\Delta m_j=0,\\pm1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>选择定则来自跃迁矩阵元 $\\langle f|\\vec r|i\\rangle$ 的角动量性质（光子携带角动量 1），不满足则跃迁概率为零。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释光谱线的数目与强度，是光谱分析的基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>选择定则是「禁戒」而非绝对禁止，高阶过程仍可发生但极弱。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>选择定则由玻尔、克拉默斯与量子力学逐步建立。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>禁戒线在天体物理中可观测到，用于测定低密度等离子体。</p></section></div>`},{id:'atomic_physics-c4s3-4',name:'氢原子能级的精细结构',tags:["def", "thm", "der", "app", "note"],brief:'相对论动能修正与自旋-轨道耦合共同给出氢原子能级的精细结构，能级只依赖 $n$ 与 $j$，同一 $j$ 的态仍简并。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>相对论动能修正与自旋-轨道耦合共同给出氢原子能级的精细结构，能级只依赖 $n$ 与 $j$，同一 $j$ 的态仍简并。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E_{nj}=-\\frac{13.6}{n^2}\\left[1+\\frac{\\alpha^2}{n}\\left(\\frac{1}{j+1/2}-\\frac{3}{4n}\\right)\\right]$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>把相对论修正 $\\Delta E_{\\text{rel}}$ 与自旋-轨道耦合 $\\Delta E_{so}$ 相加，利用 $j$ 的表达式化简，得上述公式（狄拉克方程给出相同结果）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释氢的莱曼-α 线等的细微分裂，检验量子电动力学。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>兰姆位移（1947）打破同一 $j$ 的简并，需量子电动力学解释。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>索末菲 1916 年给出早期版本，狄拉克 1928 年给出严格结果。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>精细结构常数 $\\alpha$ 的幂次决定了修正的量级。</p></section></div>`}]},{name:'4.4 塞曼效应',color:'#c2410c',desc:'',items:[{id:'atomic_physics-c4s4-1',name:'正常塞曼效应',tags:["def", "thm", "der", "app", "note"],brief:'原子在磁场中能级发生分裂，谱线分裂为三条（$m$ 差为 $0,\\pm1$），相邻谱线间隔为 $\\mu_BB/h$，称正常…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>原子在磁场中能级发生分裂，谱线分裂为三条（$m$ 差为 $0,\\pm1$），相邻谱线间隔为 $\\mu_BB/h$，称正常塞曼效应。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$h\\nu′=h\\nu+(m_2g_2-m_1g_1)\\mu_BB$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>磁相互作用能 $U=-\\vec\\mu\\cdot\\vec B=mg\\mu_BB$；跃迁频率改变 $\\Delta\\nu=(m_2g_2-m_1g_1)\\mu_BB/h$。当 $g_1=g_2=1$（单态）时，$\\Delta m=0,\\pm1$ 给出三条线。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>测量磁场强度（太阳磁场、实验室磁场），是塞曼 1896 年发现后最早的磁场测量手段。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正常塞曼效应要求初末态都是单态（$S=0$），碱土金属的某些谱线满足。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>塞曼 1896 年发现，洛伦兹 1897 年用经典电子论解释。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>洛伦兹单位 $L=\\frac{eB}{4\\pi m_e}$ 是塞曼分裂的常用单位。</p></section></div>`},{id:'atomic_physics-c4s4-2',name:'反常塞曼效应',tags:["def", "thm", "der", "app", "note"],brief:'多数原子（$S\\neq0$）的谱线分裂不止三条，且间隔不等，称反常塞曼效应；只有引入自旋与朗德 $g$ 因子才能解释。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>多数原子（$S\\neq0$）的谱线分裂不止三条，且间隔不等，称反常塞曼效应；只有引入自旋与朗德 $g$ 因子才能解释。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta\\nu=(m_2g_2-m_1g_1)\\frac{\\mu_BB}{h}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>$g$ 因子对不同 $J$ 不同，故各分裂线的位移不等；选择定则 $\\Delta m=0,\\pm1$ 决定线的数目。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>测定原子态的 $g$ 因子与量子数，是原子光谱分析的重要手段。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>「反常」只是相对经典理论而言，在量子力学中是正常现象。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>朗德 1921 年用 $g$ 因子归纳实验规律，早于自旋的提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>塞曼效应至今仍是测量恒星与星际磁场的主要方法。</p></section></div>`},{id:'atomic_physics-c4s4-3',name:'格罗春图',tags:["def", "thm", "der", "app", "note"],brief:'格罗春图用能级分裂与跃迁箭头直观表示反常塞曼效应中允许的跃迁，可预测谱线数目与相对位置。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>格罗春图用能级分裂与跃迁箭头直观表示反常塞曼效应中允许的跃迁，可预测谱线数目与相对位置。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$^{2}P_{3/2}\\leftrightarrow{}^{2}S_{1/2}:\\ 6\\ \\text{条线}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>先按 $m_Jg_J$ 画出上下能级的分裂，再按 $\\Delta m_J=0,\\pm1$ 连线；例如 $^{2}P_{3/2}\\to{}^{2}S_{1/2}$ 给出 6 条线。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析复杂光谱的磁场分裂，辅助指认谱线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不同 $J$ 的 $g$ 因子不同，导致分裂间隔不等且不对称。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>格罗春 1921 年提出该图解方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>格罗春图是原子光谱学的标准工具。</p></section></div>`},{id:'atomic_physics-c4s4-4',name:'帕邢-巴克效应',tags:["def", "thm", "der", "app", "note"],brief:'在强磁场中，自旋-轨道耦合被破坏，$\\vec L$ 与 $\\vec S$ 分别绕外场进动，谱线分裂回到「正常」的三线结构…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在强磁场中，自旋-轨道耦合被破坏，$\\vec L$ 与 $\\vec S$ 分别绕外场进动，谱线分裂回到「正常」的三线结构，称帕邢-巴克效应。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$U=\\frac{eB}{2m_e}(2S_z+L_z),\\quad \\Delta m_s=0,\\ \\Delta m_l=0,\\pm1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>弱场时 $\\vec L,\\vec S$ 先耦合成 $\\vec J$ 再绕 $\\vec B$ 进动（塞曼区）；强场时耦合能 $\\propto B$ 超过自旋-轨道耦合，$\\vec L,\\vec S$ 各自独立进动（帕邢-巴克区）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>说明磁场强度可改变角动量耦合方式，是研究原子内部相互作用的探针。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>临界场强由自旋-轨道耦合能决定，约 $1\\,\\mathrm{T}$ 量级。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>帕邢与巴克 1912 年发现。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>该效应是量子力学中「好量子数」随相互作用强度改变的典型例子。</p></section></div>`}]}]},
{id:'atomic_physics-ch5',num:'第5章',title:'泡利原理',en:'PAULI PRINCIPLE',sub:'电子组态 · 不相容 · 洪特定则',desc:'',sections:[{name:'5.1 电子组态与耦合',color:'#2563eb',desc:'',items:[{id:'atomic_physics-c5s1-1',name:'电子组态符号',tags:["def", "thm", "der", "app", "note"],brief:'电子组态用主量子数 $n$ 与角量子数 $l$ 标记每个亚层上的电子数，如铁原子基态为 $1s^22s^22p^63s^…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电子组态用主量子数 $n$ 与角量子数 $l$ 标记每个亚层上的电子数，如铁原子基态为 $1s^22s^22p^63s^23p^63d^64s^2$。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$n_1l_1^{a}n_2l_2^{b}\\cdots,\\quad l=0,1,2,3\\to s,p,d,f$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>主量子数 $n=1..7$ 对应 $K..Q$ 壳层；$l=0,1,2,3$ 对应 $s,p,d,f$ 亚层；上标为占据电子数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>记录与比较不同元素的电子排布，是理解化学性质与光谱的起点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同一亚层最多容纳 $2(2l+1)$ 个电子。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组态符号体系源自光谱学，1925 年后由泡利原理给出理论基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>激发态组态可写为 $1s^22s^22p^53p^1$ 等形式，用于标记跃迁。</p></section></div>`},{id:'atomic_physics-c5s1-2',name:'L-S 耦合',tags:["def", "thm", "der", "app", "note"],brief:'轻原子中电子间的静电相互作用远强于自旋-轨道耦合，各电子的轨道角动量先合成总 $\\vec L$、自旋先合成总 $\\vec…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>轻原子中电子间的静电相互作用远强于自旋-轨道耦合，各电子的轨道角动量先合成总 $\\vec L$、自旋先合成总 $\\vec S$，再合成总 $\\vec J$，称 L-S 耦合（罗素-桑德斯耦合）。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec S=\\sum_i\\vec s_i,\\ \\vec L=\\sum_i\\vec l_i,\\ \\vec J=\\vec L+\\vec S$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>合成规则：$L=l_1+l_2,\\ldots,|l_1-l_2|$；$S=s_1+s_2,\\ldots,|s_1-s_2|$；再 $J=L+S,\\ldots,|L-S|$。每个 $(L,S)$ 给出一个多重态，共 $2S+1$ 个 $J$ 值。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构造原子态、解释多重结构与光谱多重线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>轻原子（$Z$ 较小）适用；重原子因自旋-轨道耦合强而转向 j-j 耦合。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>罗素与桑德斯 1925 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>L-S 耦合下 $\\Delta S=0$ 的跃迁选择定则成立。</p></section></div>`},{id:'atomic_physics-c5s1-3',name:'j-j 耦合',tags:["def", "thm", "der", "app", "note"],brief:'重原子中自旋-轨道耦合很强，每个电子先合成自己的 $\\vec j_i$，再合成总 $\\vec J$，称 j-j 耦合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>重原子中自旋-轨道耦合很强，每个电子先合成自己的 $\\vec j_i$，再合成总 $\\vec J$，称 j-j 耦合。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec j_i=\\vec l_i+\\vec s_i,\\quad \\vec J=\\sum_i\\vec j_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对每个电子，$j_i=l_i\\pm1/2$；再由各 $j_i$ 合成 $J$。此时 $L$ 与 $S$ 不再是好量子数，光谱项不再按多重态分组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释重元素（如铅、铀）光谱的复杂结构。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>选择定则为 $\\Delta j_i=0,\\pm1$、$\\Delta J=0,\\pm1$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>j-j 耦合由朗德等人在分析重元素光谱时提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>L-S 与 j-j 是两种极端，实际原子介于两者之间，需中间耦合处理。</p></section></div>`},{id:'atomic_physics-c5s1-4',name:'角动量合成与选择定则',tags:["def", "thm", "der", "app", "note"],brief:'两个角动量耦合后，总角动量量子数取从和到差的整数步长，共 $2\\min(l_1,l_2)+1$ 个可能值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个角动量耦合后，总角动量量子数取从和到差的整数步长，共 $2\\min(l_1,l_2)+1$ 个可能值。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$l=l_1+l_2,\\ldots,|l_1-l_2|,\\ \\text{共}\\ 2\\min(l_1,l_2)+1\\ \\text{个}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角动量的矢量模型或群论（SU(2) 表示分解）严格推出；每个 $L$ 对应 $2L+1$ 个 $m$ 投影。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算原子态数目、判断跃迁是否允许。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>L-S 耦合：$\\Delta S=0$、$\\Delta L=0,\\pm1$、$\\Delta J=0,\\pm1$、$\\Delta M_J=0,\\pm1$。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>角动量合成规则（Clebsch-Gordan 级数）由维格纳 1927 年系统化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>选择定则源于光子携带角动量 1 与宇称变化。</p></section></div>`}]},{name:'5.2 泡利不相容原理',color:'#7c3aed',desc:'',items:[{id:'atomic_physics-c5s2-1',name:'泡利不相容原理',tags:["def", "thm", "der", "app", "note"],brief:'同一原子中不可能有两个电子具有完全相同的四个量子数。这解释了壳层容量与元素周期表的周期结构。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同一原子中不可能有两个电子具有完全相同的四个量子数。这解释了壳层容量与元素周期表的周期结构。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(n,l,m_l,m_s)\\ \\text{不能完全相同}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>泡利 1925 年为解释反常塞曼效应与周期表提出；后来由量子场论证明：半整数自旋粒子（费米子）的波函数反对称，交换两粒子波函数变号，故不能占据同一态。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>决定电子排布、化学键与固体的费米面，是物质结构的基本原理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>该原理只适用于费米子；玻色子（如光子）可无限多占据同一态。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>泡利 1925 年提出，1945 年获诺贝尔物理学奖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>泡利原理与自旋-统计定理等价，是量子场论的基本结论。</p></section></div>`},{id:'atomic_physics-c5s2-2',name:'壳层容量与周期表',tags:["def", "thm", "der", "app", "note"],brief:'每个亚层容纳 $2(2l+1)$ 个电子，壳层容量为各亚层之和：$K$ 层 2、$L$ 层 8、$M$ 层 18、$N$…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>每个亚层容纳 $2(2l+1)$ 个电子，壳层容量为各亚层之和：$K$ 层 2、$L$ 层 8、$M$ 层 18、$N$ 层 32。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{容量}=2(2l+1),\\quad K,L,M,N:\\ 2,8,18,32$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>$s$ 亚层 2 个、$p$ 亚层 6 个、$d$ 亚层 10 个、$f$ 亚层 14 个，累加得壳层容量；周期表每周期长度 2, 8, 8, 18, 18, 32… 正对应壳层填充。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释元素周期律、化学性质周期性与族的分组。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>实际填充顺序受能级交错影响（$4s$ 先于 $3d$），故周期长度不严格等于壳层容量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>周期表的结构在泡利原理提出后获得量子解释。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>镧系与锕系的 14 个元素对应 $f$ 亚层填充。</p></section></div>`},{id:'atomic_physics-c5s2-3',name:'电子排布顺序与能级交错',tags:["def", "thm", "der", "app", "note"],brief:'电子按能量从低到高填充，顺序并非简单按 $n$ 排列，而是出现 $4s$ 先于 $3d$ 的能级交错。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电子按能量从低到高填充，顺序并非简单按 $n$ 排列，而是出现 $4s$ 先于 $3d$ 的能级交错。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$1s&lt;2s&lt;2p&lt;3s&lt;3p&lt;4s&lt;3d&lt;4p&lt;5s&lt;4d&lt;5p&lt;6s&lt;4f&lt;5d&lt;6p$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>多电子原子中，电子感受到核电荷被内层电子屏蔽，有效核电荷 $Z_{\\text{eff}}=Z-\\sigma$；$n$ 小、$l$ 小的轨道穿透性强、能量低。经验规则（马德隆规则）给出填充次序。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>写出基态组态、预测元素性质与磁性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>填充顺序是近似规则，存在例外（如 Cr、Cu 的半满/全满稳定性）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>马德隆 1936 年总结出 $n+l$ 规则。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>洪特规则进一步确定同一组态中的最低能级。</p></section></div>`}]},{name:'5.3 洪特定则与能级间隔',color:'#0f766e',desc:'',items:[{id:'atomic_physics-c5s3-1',name:'洪特定则',tags:["def", "thm", "der", "app", "note"],brief:'同一电子组态中，总自旋 $S$ 最大的能级最低；$S$ 相同时总轨道角动量 $L$ 最大的能级最低。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同一电子组态中，总自旋 $S$ 最大的能级最低；$S$ 相同时总轨道角动量 $L$ 最大的能级最低。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S\\ \\text{最大者最低},\\ \\text{同 }S\\text{ 时 }L\\text{ 最大者最低}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>物理根源是交换相互作用：自旋平行的电子波函数空间部分反对称，电子间平均距离更大，库仑排斥能更低。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定基态原子态，解释磁性（未成对电子数）与光谱多重结构。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>洪特规则只适用于同一组态内部的能级排序。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>洪特 1925 年由光谱数据归纳。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>例：碳 $2p^2$ 的基态为 $^3P_0$，而非 $^1D_2$ 或 $^1S_0$。</p></section></div>`},{id:'atomic_physics-c5s3-2',name:'洪特附加规则',tags:["def", "thm", "der", "app", "note"],brief:'在同一 $L$ 的多重态内部，电子数不超过半满时 $J$ 最小者能量最低；超过半满时 $J$ 最大者最低。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在同一 $L$ 的多重态内部，电子数不超过半满时 $J$ 最小者能量最低；超过半满时 $J$ 最大者最低。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{电子数}\\le\\text{半满}:\\ J=|L-S|;\\quad >\\text{半满}:\\ J=L+S$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由自旋-轨道耦合能的符号决定：$\\Delta E\\propto\\vec L\\cdot\\vec S$，少于半满时 $\\vec L$ 与 $\\vec S$ 反平行（$J$ 小）能量低，多于半满时相反。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定基态的具体 $J$ 值，如碳 $^3P_0$、氧 $^3P_2$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>该规则只适用于基态多重态，且要求 L-S 耦合近似成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>洪特 1927 年补充。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>稀土离子的磁性分析常用此规则。</p></section></div>`},{id:'atomic_physics-c5s3-3',name:'朗德间隔定则',tags:["def", "thm", "der", "app", "note"],brief:'同一多重态中相邻能级的间隔正比于较大的 $J$ 值，这直接反映自旋-轨道耦合能 $\\propto\\vec L\\cdot\\…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同一多重态中相邻能级的间隔正比于较大的 $J$ 值，这直接反映自旋-轨道耦合能 $\\propto\\vec L\\cdot\\vec S$ 的性质。</p></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E_J-E_{J-1}\\propto J$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>$E_J=\\frac12A[J(J+1)-L(L+1)-S(S+1)]$，相邻差 $\\Delta E=A\\cdot J$，故间隔比等于 $J$ 之比。例 $^3P$ 的 $J=2,1,0$，间隔比 $3:2$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>验证 L-S 耦合是否成立、拟合自旋-轨道耦合常数 $A$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>若实测间隔偏离该比例，说明耦合接近 j-j 或存在其他相互作用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>朗德 1923 年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>朗德间隔定则是判断原子态与耦合方式的重要判据。</p></section></div>`}]}]},
